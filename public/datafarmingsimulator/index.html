  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

{{ hardReset }}\" style=\"font-size:9px;padding:3px 7px;border:1px dotted #0b0b0c;background:#fff;cursor:pointer;opacity:.85;\" style-hover=\"opacity:1;background:#0b0b0c;color:#fff;\">{{ resetLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;devMode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;section&quot;:&quot;Developer&quot;,&quot;tsType&quot;:&quot;boolean&quot;},&quot;simSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.25,&quot;max&quot;:8,&quot;step&quot;:0.25,&quot;unit&quot;:&quot;×&quot;,&quot;section&quot;:&quot;Simulation&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;glitchCeiling&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:1.5,&quot;step&quot;:0.05,&quot;section&quot;:&quot;Simulation&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;ambientGoo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;section&quot;:&quot;Simulation&quot;,&quot;tsType&quot;:&quot;boolean&quot;},&quot;marioName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;M.&quot;,&quot;section&quot;:&quot;Facilities&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  /* ============================================================================\n     DESIGN BIBLE — LOCKED DECISIONS (do not water down; full text in CLAUDE.md)\n     These are the patterns the author kept repeating; hardcoded here so they\n     survive context trimming and stay attached to the source.\n     ----------------------------------------------------------------------------\n     1  ENDLESS (important): never a real loss; always scale up; meaning recombined.\n     2  YOU ARE THE ALGORITHM: switch auto<->manual; never lose but FEEL like failing;\n        evade piling tasks by switching; you only care about keeping the DB alive.\n     3  M./CYBERMARIO (cherished, make it shine): black skateboarder swapping parts in\n        a machinery building; rectangular glasses, short hair, plump lips; very slow,\n        Baloo-like, smaller; works in BACKGROUND while networking is chaos; activity\n        tracker; Chrome-dino/SUPERHOT-simple, demoscene; DMT \"comes back thru out door\";\n        his mode is NEVER mandatory; tasks pile up while away; MAIN subplot not the game.\n     4  GLITCH (don't underdo it): white page baseline; flickering random pixel groups,\n        random color, lumps of gleaming multicolor 3D-ish goo; META layer for saturation;\n        delayed onset ~5min, not at start.\n     5  SATURATION: at 98% a competitor buys the factory, resets ~back to normal.\n     6  NUMBERS MAKE MUSIC: counters at different speeds trace sines; tone tracks\n        consumption; audio purchasable early, tied to cybermario.\n     7  BUREAUCRATIC ABSURDISM / cold euphemism (hellish): notifications pile up -> auto\n        -reply agents -> crash logs pile on top; recursion IS the feature; flat cold copy.\n     8  COSMIC/ASCII HORROR: stalled end = buy all GAFAM, sell only to self (closed loop);\n        DMT loops turn farms/parts into little characters (Mario-Wonder but stronger).\n     9  INPUT UNPREDICTABILITY: non-mouse input misbehaves; regularity-seekers get regularity\n        then it's revoked; buy it back in a HIDDEN DEBT MENU.\n     10 NO STANLEY PARABLE: never constantly address player; fourth wall stays procedural\n        (glitch, drifting UI, fake consent/cookie banners as mechanics).\n     11 PACING: ~4h playable, emergent per run; absurd within 10min then calm plateaux that\n        rot as you scale; failing triggers miracles (CEO day off -> sales climb).\n     12 STRUCTURE: prestige loops ARE the tutorial; endless+audits is core; networking main,\n        cybermario main subplot, DMT optional pandemonium; all connected.\n     ============================================================================ */\n  get TUNE(){ return (window.DFS && window.DFS.tuning) || {}; }\n  get ART(){ return (window.DFS && window.DFS.art) || {}; }\n  /* The other half of the transfer: a build finds states left for it by LATER builds. This is what\n     makes \"revert to the in medias res\" real rather than a caption — the offer only appears if a\n     newer build actually wrote one for this id. */\n  legacyInbox() {\n    try {\n      const k = 'dfs.legacy.' + this.BUILD_ID, raw = localStorage.getItem(k);\n      if (!raw) return null;\n      const st = JSON.parse(raw);\n      return { key: k, from: st.legacyFrom || '?', at: st.legacyAt || 0, phase: st.phase || 0, acq: st.acq || 0 };\n    } catch(_) { return null; }\n  }\n  loadLegacy = () => {\n    const inb = this.legacyInbox(); if (!inb) return;\n    this.click('sign');\n    try {\n      const st = JSON.parse(localStorage.getItem(inb.key));\n      delete st.legacyFrom; delete st.legacyAt;\n      st.buildId = this.BUILD_ID;\n      /* ONLY WHAT THIS BUILD ALREADY KNEW. Copying a newer state wholesale would carry fields this\n         version has no code for — they would sit in the save, be written back on every tick, and\n         corrupt it quietly. So the adoption is an INTERSECTION with the keys already present, and\n         the count of what was dropped is reported. The farm comes back with pieces missing. That is\n         the honest behaviour and it is also the better joke. */\n      let kept = 0, dropped = 0;\n      for (const k in st) { if (Object.prototype.hasOwnProperty.call(this.g, k)) { this.g[k] = st[k]; kept++; } else dropped++; }\n      this._legacyDrop = dropped;\n      localStorage.removeItem(inb.key);\n      this.say('A state from ' + inb.from + ' has been adopted. ' + (this._legacyDrop||0) + ' field(s) were not recognised and have been discarded. They are not listed.', 'note');\n      this.save(); this.setState({});\n    } catch(_) {}\n  };\n  _checkModules(final) {\n    // addendum §2: a standalone download has no game/ folder to fetch, and its modules are\n    // inlined at build time. If they are genuinely populated there is nothing wrong — and a\n    // banner that fires when nothing is wrong stops being read within a day, which is exactly\n    // how the original orphaned-module bug survived. Only a module that was EXPECTED and\n    // FAILED gets the red band.\n    const miss = ['tuning','art','narrative','versions','zhuangzi'].filter(k => !window.DFS || !window.DFS[k]);\n    if (!window.MarioCorpus) miss.push('mario_corpus.js');\n    if (!window.DFS_MARIO_PACK) miss.push('mario_corpus_pack.js');\n    if (!this.corpus && window.MarioCorpus && window.DFS_MARIO_PACK && this.g) { try { this.corpus = new window.MarioCorpus(window.DFS_MARIO_PACK, this.g.seed||1); } catch(e) {} }\n    this._inline = !!window.DFS_INLINE;\n    const had = !!this._orphaned; this._orphaned = miss.length ? miss : null;\n    if (miss.length && final) {\n      if (this._inline) console.warn('[DFS] standalone build, modules not inlined:', miss.join(', '), '— running on inline defaults, which is expected here.');\n      else console.error('[DFS] ORPHANED MODULES:', miss.join(', '), '— expected from game/ and not loaded.');\n    }\n    if (had !== !!this._orphaned) this.setState({});\n  }\n  /* addendum §3. A pool resolves as: this build's pin → base → the engine's inline copy.\n     Editing `base` still propagates to every build, which is the point of the split; but an\n     era can pin the two or three pools that made it itself, so the scroller stays a museum\n     rather than thirty code paths speaking in today's voice. narrative.js may be flat (all\n     base) or { base:{}, versions:{ 'v0.53': {…} } } — both are read.                        */\n  NARR(k) {\n    const N = (window.DFS && window.DFS.narrative) || {};\n    const base = N.base || N;\n    const pin = N.versions && N.versions[this.BUILD_ID];\n    const v = (pin && pin[k] !== undefined) ? pin[k] : base[k];\n    return v;\n  }\n  applyNarrative(){ try { const N=this.NAR(); [['posts','POSTS'],['buyers','BUYERS'],['wares','WARES'],['entsay','ENTSAY'],['mids','MIDS'],['seeds','SEEDS'],['ends','ENDS'],['doorblab','DOORBLAB'],['converse','CONVERSE'],['slideTricks','SLIDE_TRICKS'],['slideThoughts','SLIDE_THOUGHTS'],['airTricks','AIR_TRICKS'],['ads','ADS'],['sides','SIDES'],['sideKanji','SIDE_KANJI'],['elements','ELEMENTS'],['waterSrc','WATERSRC'],['oversightForms','OVERSIGHT_FORMS']].forEach(p=>{ const k=p[0], fld=p[1]; if(Array.isArray(N[k])&&N[k].length) this[fld]=N[k]; }); } catch(e){} }\n  clearPadKeys=()=>{ const f=this.floor,a=this.algo; if(f&&f.keys){f.keys.l=f.keys.r=f.keys.j=f.keys.f=f.keys.dn=false; f.tapKey=null;} if(a&&a.keys){a.keys.l=a.keys.r=a.keys.f=a.keys.b=false; a.tapKey=null;} };\n  fullToggle = () => {\n    const d = document, el = d.documentElement;\n    const lockViewport = () => {\n      this._pfs = !this._pfs;\n      if (this._pfs) { el.style.height = '100dvh'; d.body.style.overflow = 'hidden'; try { window.scrollTo(0,1); } catch(_) {}\n        this.say('Fullscreen is not available here. The viewport has been locked instead.'); }\n      else { el.style.height = ''; d.body.style.overflow = ''; }\n      this.setState({});\n    };\n    try {\n      if (d.fullscreenElement || d.webkitFullscreenElement) { const ex = d.exitFullscreen || d.webkitExitFullscreen; const r = ex && ex.call(d); if (r && r.catch) r.catch(()=>{}); return; }\n      const req = el.requestFullscreen || el.webkitRequestFullscreen;\n      if (req) { const p = req.call(el); if (p && p.catch) { p.catch(() => lockViewport()); } return; }\n    } catch(e) {}\n    lockViewport();\n  };\n  glitchRef = React.createRef();\n  floorRef = React.createRef();\n  algoRef = React.createRef();\n  fileRef = React.createRef();\n  burst = 0; battery = null; lastInput = Date.now(); saveMsg = 'autosaving';\n\n  freshState() {\n    return {\n      v:1, t:0, money:0, lifetimeRev:0, debt:0, licenses:0,\n      users:0, virality:0, campaigns:0,\n      data:0, clickPower:1, dataPerUser:1, quality:1, extraction:1,\n      hs:{ stage:1, pos:0, cont:0, ceil:0, envOn:false, pot:0.4, flash:0, conf:0, opened:{} },\n      customers:0, price:1, elasticity:1.3, demandBoost:1, autoSell:false, dynPricing:false, brand:0, posts:0,\n      racks:0, broken:0, racksUnlocked:false,\n      mario:{hired:false,x:0,tgt:0,state:'idle',timer:3,task:'arriving',fixed:0,breaks:0,dist:0,guilt:0,wallet:0,dmt:false,hiredT:0,inv:[],outT:300,log:[]},\n      snooze:false, piles:[], charter:false,\n      sat:0, heat:0, audit:null, auditCd:200,\n      done:{}, gen:0, procQ:[], phase:0,\n      acq:0, liquidity:0, acqOpen:false, acqBody:'',\n      firedTotal:0, skin:null, brokenIdxs:[], poems:0, seed:(Math.random()*2e9)|0, autos:[], dataHuman:0, dataSynth:0, notebookTaken:false, metMario:false, minds:0, harvests:0, water:0, waterSrc:0, waterLog:[], qd:{},\n      consent:0, toggles:{ACQUISITION:false,PRICING:false,PROCESSING:false,PITCHING:false}, togglesUnlocked:false,\n      buildId:this.BUILD_ID, builtAt:'2026-07-27',\n      audioOwned:false, audioOn:false,\n      keys:{last:'',streak:0,granted:null,grantT:0,salt:1,revealed:false},\n      tele:{clicks:0,keys:0,hidden:0},\n      dayOffOwned:false, anomalyT:0, gafam:0, closedLoop:false,\n      log:[]\n    };\n  }\n\n  // ---------- helpers ----------\n  get sp() { return this.props.simSpeed ?? 1; }\n  fmt(n) {\n    if (n === undefined || n === null || isNaN(n)) return '0';\n    if (!isFinite(n)) return '∞';\n    if (n < 0) return '−' + this.fmt(-n);\n    const AB = ['','k','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc','UDc','DDc','TDc'];\n    if (n < 1000) return n < 10 && n % 1 ? n.toFixed(2) : String(Math.floor(n));\n    let i = 0; while (n >= 1000 && i < AB.length-1) { n /= 1000; i++; }\n    if (i === AB.length-1 && n >= 1000) return '10^' + Math.floor(Math.log10(n) + 3*i);\n    return n.toFixed(n < 100 ? 1 : 0) + AB[i];\n  }\n  fmtMoney(n) { return '$' + this.fmt(n); }\n  fmtData(gb) {\n    if (gb === undefined || isNaN(gb)) return '0 MB';\n    const U = ['MB','GB','TB','PB','EB','ZB','YB','RB','QB','LXU'];\n    let v = gb * 1000, i = 0;\n    while (v >= 1000 && i < U.length-1) { v /= 1000; i++; }\n    return (v < 10 && v % 1 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : String(Math.floor(v))) + ' ' + U[i];\n  }\n  clock() { const s = Math.floor(this.g.t); const h = Math.floor(s/3600), m = Math.floor(s/60)%60, ss = s%60; const p = x => String(x).padStart(2,'0'); return 'T+' + p(h) + ':' + p(m) + ':' + p(ss); }\n  say(msg, tone) { this.g.log.unshift({t:this.clock(), msg}); if (this.g.log.length > 14) this.g.log.length = 14; this.ping(tone || 'note'); }\n  ping(tone) { this.beaconTone = tone; this.beaconUntil = Date.now() + 4500; }\n  devOn() { return !!(this.props.devMode || (this.g && this.g.dev)); }\n\n  /* ---------- R-01: LIVE TUNING BENCH ------------------------------------------\n     moveMax was reported \"too fast\" four times over several weeks and tuned blind\n     four times. No one can find that number by reasoning — it needs a slider, in\n     game, writing into window.DFS.tuning while M. is rolling. This bench is that.\n     Overrides live in the save (g.tune) so a session's feel survives a reload, and\n     COPY PATCH emits them as a tuning.js diff so a keeper becomes permanent.       */\n  TUNEBENCH = [\n    ['FLOOR — the platformer, in pixels', [\n      ['floor.moveMax', 'roll speed', 20, 200, 1],\n      ['floor.moveAcc', 'push', 200, 2600, 25],\n      ['floor.stepUpMax', 'step-up height', 4, 60, 1],\n      ['floor.stepUpTime', 'step-up time (s)', 0.02, 0.5, 0.01],\n      ['floor.fixReach', 'fix reach (bodies)', 0.4, 3, 0.05],\n      ['floor.fixReachAir', 'fix reach airborne ×', 1, 3, 0.1],\n      ['floor.conduitY', 'ceiling tray height', -90, -30, 1],\n      ['floor.conduitCatch', 'tray latch window', 2, 20, 1],\n      ['floor.conduitGuilt', 'guilt bled on the tray', 0, 30, 1],\n      ['floor.shrinkPerPhase', 'M. s nking light that meant nothing','tightening one (1) screw'];\n    const IDLE = ['vibing','listening to the room tone','practicing a slow ollie','reading the safety poster again','counting the racks. all present.','standing where the light is warm'];\n    const BREAK = ['lunch (falafel)','water break','staring at the OUT door','stretching, slowly','sitting on his board'];\n    m.timer -= dt;\n    if (m.state === 'out') { if (m.timer <= 0) { m.state = 'idle'; m.timer = 4; m.task = 'returns through the IN door. He says nothing.'; this.mlog('returned. said nothing.'); } return; }\n    m.outT -= dt;\n    if (m.outT <= 0) { m.state = 'out'; m.timer = 7; m.outT = 300 + Math.random()*240; m.task = 'exits through the OUT door.'; this.mlog('exited through the OUT door.'); this.transBurst = 1; this.swirl(); return; }\n    if (m.state === 'fixing') {\n      if (m.timer <= 0) { if (g.broken > 0) g.broken--; m.fixed++; m.state = 'idle'; m.timer = 2 + Math.random()*4; m.task = 'done. admiring the work.'; this.mlog('fixed: ' + m.lastFix); }\n      return;\n    }\n    if (m.state === 'travel') {\n      const dir = Math.sign(m.tgt - m.x); m.x += dir * 0.35 * dt; m.dist += 0.35*dt;\n      if (Math.abs(m.tgt - m.x) < 0.2) { m.state = 'fixing'; m.timer = 8 + Math.random()*12; m.lastFix = this.rnd(FIX); m.task = m.lastFix; }\n      return;\n    }\n    // idle\n    if (m.timer <= 0) {\n      if (g.broken > 0) { m.state = 'travel'; m.tgt = Math.random() * Math.max(1, g.racks-1); m.task = 'rolling to the failed unit. unhurried.'; }\n      else if (Math.random() < 0.25) {\n        m.state = 'idle'; m.timer = 10 + Math.random()*15; m.task = this.rnd(BREAK); m.breaks++;\n        // §5 OFFSCREEN POEMS. He writes whether or not you are in the building. The counter moves\n        // on his own breaks, the guilt comes off, and the SOURCE is recorded — so the end-of-run\n        // ledger is a receipt of work that happened while you were at the desk, not a reward for\n        // having watched. Nothing announces it on the desk; you find it in the ledger, afterwards.\n        if (!this.floor || !this.floor.open) {\n          if (Math.random() < 0.34) {\n            // a poem offscreen is still three lines: it must carry the same provenance as one you\n            // watched, or the ledger silently credits watched work more than unwatched work.\n            const recs = [this.corpSourced('notebook'), this.corpSourced('break_line'), this.corpSourced('notebook')].filter(Boolean);\n            m.guilt = Math.max(0, (m.guilt||0) - 6);\n            m.task = 'writing something down. slowly.';\n            this.mlog(recs.length ? recs[0].text : 'wrote something down. unbilled.');\n            this.addPoem(recs.map(r => r.work), true);\n          }\n        }\n      }\n      else { m.state = 'idle'; m.timer = 6 + Math.random()*10; m.task = this.rnd(IDLE); }\n    }\n  }\n  /* §5 THE LEDGER. Every poem that happens is recorded WITH the work it came from. Provenance was\n     always in the corpus (`lineWithSource` returns `work` and `lang`); it was simply never kept.\n     Printed once, at the end of a run, as a receipt — not a score. Capped, so a long run doesn't\n     grow the save without bound. */\n  /* ONE ENTRY PER POEM, carrying the distinct works that poem drew on. The first cut recorded one\n     entry per LINE on screen but one per POEM offscreen, so the table mixed two units: \"2 × — Work\n     C\" meant two lines of one poem while \"1 × — Work D\" meant one whole poem. On a sheet headed\n     NON-SYNTHETIC OUTPUT OF RECORD, a provenance miscount undermines the only thing the feature\n     exists to assert. It also under-credited his unwatched work threefold and made the cap evict\n     watched poems three times faster. Both routes now report in the same unit. */\n  /* ONE DOOR for the counter. Every route that produces a poem goes through here, so no path can\n     bump `g.poems` without recording where it came from. SCHEDULE M counts its header from\n     `g. trim() + '\\u2026'; }\n    return s;\n  }\n  ledgerAdd(works, offscreen) {\n    const g = this.g; if (!g.ledger) g.ledger = [];\n    const list = (Array.isArray(works) ? works : [works])\n      .map(w => (w && typeof w === 'object') ? w.work : w)\n      .map(w => this._citeWork(w))\n      .filter(Boolean);\n    const uniq = list.filter((w, i) => list.indexOf(w) === i);\n    g.ledger.unshift({ t: this.clock(), works: uniq, off: !!offscreen });\n    if (g.ledger.length > 60) g.ledger.length = 60;\n  }\n  ledgerLines() {\n    const g = this.g, L = g.ledger || [];\n    if (!L.length) return [];\n    // poems per work: each work counts ONCE per poem, however many of its lines that poem used\n    const byWork = {};\n    L.forEach(e => {\n      const ws = (e.works && e.works.length) ? e.works : ['work not identified in the archive'];\n      ws.forEach(w => { byWork[w] = (byWork[w]||0) + 1; });\n    });\n    const works = Object.keys(byWork).sort((a, b) => byWork[b] - byWork[a]);\n    const off = L.filter(e => e.off).length;\n    const out = [(g.poems||0) + ' poem(s). ' + off + ' of them while you were at the desk.',\n      'attribution below is poems per work; a poem may draw on several.'];\n    works.slice(0, 8).forEach(w => out.push('  ' + byWork[w] + ' poem(s) — ' + w));\n    if (works.length > 8) out.push('  … and ' + (works.length - 8) + ' more work(s).');\n    return out;\n  }\n  mlog(msg) { const m = this.g.mario; m.log.unshift({msg: this.clock() + ' ' + msg}); if (m.log.length > 3) m.log.length = 3; }\n\n  // ---------- piles ----------\n  pileName(i) { const N = ['NOTIFICATIONS','CRASH LOGS','INCIDENT REPORTS','DIGEST AUDITS','COMPLIANCE SUMMARIES','POSTMORTEM POSTMORTEMS','META-ESCALATION MINUTES','MINUTES OF THE MINUTES']; return N[i] || 'LAYER-' + i + ' RESIDUE'; }\n  agentName(i) { const A = ['AUTO-REPLY AGENTS','LOG SHREDDER DAEMONS','REPORT COMPRESSORS','AUDIT SUMMARIZER SWARM','META-COMPLIANCE ORACLES','APOLOGY SYNTHESIZERS','SILENCE CURATORS','FINAL INTERPRETERS']; return A[i] || 'TIER-' + i + ' INTERCESSORS'; }\n  spawnPile(i, amount) {\n    const g = this.g;\n    i = Math.max(0, Math.min(7, Math.floor(i) || 0));\n    if (!isFinite(amount)) amount = 0;\n    while (g.piles.length <= i) { g.piles.push({count:0, agents:0}); if (g.piles.length > 1) this.say('A new pile exists: ' + this.pileName(g.piles.length-1) + '. It did not exist before.'); }\n    g.piles[i].count += amount;\n  }\n  totalAgents() { return this.g.piles.reduce((s,p) => s + p.agents, 0); }\n  /* FRICTION. The piles metastasised beautifully and cost NOTHING — §7's recursion was scenery you\n     could ignore for ever. Unprocessed administration now drags on everything: log-scaled so the\n     first hundred items hurt and the ten-thousandth barely adds, capped so it can never fully stop\n     the farm (CLAUDE.md §1: never a real loss). BRAND EQUITY absorbs part of it — which is the\n     actual joke: the remedy for an admin backlog is publishing, and publishing makes more admin. */\n  frictionRaw() {\n    const g = this.g;\n    const items = (g.piles||[]).reduce((s,p) => s + (p.count||0), 0);\n    if (items <= 0) return 0;\n    const F = (this.TUNE.friction) || {};\n    return Math.min(F.cap == null ? 0.62 : F.cap, Math.log10(1 + items) / (F.decades == null ? 5.2 : F.decades));\n  }\n  friction() {\n    const g = this.g, F = (this.TUNE.friction) || {};\n    return this.frictionRaw() * (1 - (g.brand||0) * (F.brandAbsorb == null ? 0.55 : F.brandAbsorb));\n  }\n  tickPiles(dt) {\n    const g = this.g;\n    if (g.piles.length === 0 && g.users >= 40) { this.spawnPile(0, 3); this.say('You have users now. Users generate notifications. Notifications require processing. This is the law.'); }\n    if (g.piles.length === 0) return;\n    // inflow to layer 0\n    g.piles[0].count += (0.03 + g.users*0.00001 + g.customers*0.015 + (g.phase||0)*0.06 + (g.audit?0.5:0)) * dt * 10;\n    // agents process, spawning next layer\n    for (let i = 0; i < g.piles.length; i++) {\n      const p = g.piles[i];\n      if (p.agents > 0) {\n        const done = Math.min(p.count, p.agents * 0.6 * dt * 10);\n        p.count -= done;\n        if (done > 0) this.spawnPile(Math.min(i+1, 7), done * (0.28 + (g.phase||0)*0.035));\n      }\n      // the bureaucracy metastasizes on its own: a large pile generates the pile ABOUT the pile\n      if (p.count > 250 && i < 7 && (g.phase||0) >= 1) this.spawnPile(i+1, p.count * 0.0016 * dt * 10);\n      p.count = Math.max(0, p.count);\n    }\n    // deepest layer with no agents slowly composts into saturation\n    const last = g.piles[g.piles.length-1];\n    if (last.count > 400) g.sat = Math.min(100, g.sat + 0.01*dt*10);\n  }\n  agentCost(i) { const p = this.g.piles[i]; return 25 * Math.pow(4, i) * Math.pow(1.35, p ? p.agents : 0); }\n\n  // ---------- audits ----------\n  tickAudit(dt) {\n    const g = this.g;\n    if (g.audit) {\n      g.audit.timer -= dt;\n      if (g.audit.timer <= 0) {\n        const fine = g.money * 0.15;\n        g.money -= fine; g.sat = Math.min(100, g.sat + 6);\n        this.say('AUDIT UNANSWERED. Fine assessed: ' + this.fmtMoney(fine) + '. The seal remains in your file forever.', 'bad');\n        g.audit = null; g.auditCd = 150 + Math.random()*150;\n      }\n      return;\n    }\n    if (g.phase < 1) return;\n    g.auditCd -= dt * (1 + g.heat*0.15);\n    if (g.auditCd <= 0) {\n      const sec = Math.floor(Math.random()*89+11) + '§' + Math.floor(Math.random()*9+1);\n      const forms = ['Form 27-B (Provenance of Feelings)','Schedule H (Undisclosed Inferences)','Exhibit K (Consent Chain of Custody)','Form 9 (Explain the Algorithm in One Sentence)','Annex Ω (List All Users Alphabetically by Dream)'];\n      const seals = ['harvest','campaign','sales'];\n      g.audit = { sec, form: this.rnd(forms), timer: 90, seal: this.rnd(seals), cost: Math.max(20, g.money*0.08) };\n      this.say('REGULATORY AUDIT (SECTION ' + sec + '). ' + g.audit.form + ' is demanded. One subsystem is SEALED pending review.', 'bad');\n      { const _au = this.corpLine('audit'); if (_au) { g.audit.voice = _au; this.say('\\u2014 ' + _au); } }\n      this.blip(180);\n    }\n  }\n\n  // ---------- acquisition (prestige) ----------\n  triggerAcq() {\n    const g = this.g;\n    const buyers = ['Verdant Metrics LLC','The Cloume Group','Sincere Data Amalgamated','Growth Object SA','A Larger Farm','Feldspath Metatransfer Holdings'];\n    const gain = Math.max(1, Math.floor(Math.pow(Math.log10(g.lifetimeRev+10), 2) * (1 + g.acq*0.5)));\n    g.acqGain = gain;\n    g.acqBody = 'Saturation has reached 98%.\\n\\nPursuant to the Standard Inevitability Clause, your farm has been acquired by ' + this.rnd(buyers) + ' for an amount that is confidential even to you.\\n\\nYou will retain: your liquidity (+' + gain + '), your technician, your file.\\nYou will lose: everything else.\\nWorkforce released: ' + this.fmt(this.firedCount()) + ' humans. They were not told your name.\\n\\nOnly your point of view survives the transfer. Some cosmetic drift may occur.\\n\\nThings will be relatively back to normal.';\n    // §5 the receipt. The acquisition sheet counts everything the farm produced; this is the one\n    // column it never had — what he wrote while it ran, and which of his books it came out of.\n    // §5 SCHEDULE M is WITHHELD from the sheet (Cheikh, 2026-07-29: \"too much — just the note of\n    // acquisition in medias res is already challenging enough\"). The ledger keeps recording, so the\n    // provenance is intact and the column can be surfaced later, on miracle.nu where it belongs.\n    void this.ledgerLines;\n    g.acqOpen = true; this.save();\n  }\n  // Big letters BUILT from small ASCII elements — not a word hidden inside a square of noise,\n  // which is what it was and which was unreadable. Five-row banner font, each cell a small glyph.\n  SPLASH_FONT = {\n    A:['.#.','#.#','###','#.#','#.#'], D:['##.','#.#','#.#','#.#','##.'],\n    F:['###','#..','##.','#..','#..'], G:['.##','#..','#.#','#.#','.##'],\n    I:['###','.#.','.#.','.#.','###'], L:['#..','#..','#..','#..','###'],\n    M:['#.#','###','###','#.#','#.#'], N:['#.#','###','###','###','#.#'],\n    O:['.#.','#.#','#.#','#.#','.#.'], R:['##.','#.#','##.','#.#','#.#'],\n    S:['.##','#..','.#.','..#','##.'], T:['###','.#.','.#.','.#.','.#.'],\n    U:['#.#','#.#','#.#','#.#','.##'], ' ':['...','...','...','...','...'],\n  };\n  _splashWord(word) {\n    const F = this.SPLASH_FONT, EL = '▓▒█▓▓▒';\n    const out = ['','','','',''];\n    for (const ch of word) {\n      const g = F[ch] || F[' '];\n      for (let r = 0; r < 5; r++) {\n        let s = '';\n        for (const c of g[r]) s += (c === '#' ? EL[Math.floor(Math.random()*EL.length)] : ' ');\n        out[r] += s + ' ';\n      }\n    }\n    return out;\n  }\n  _splashArt() {\n    if (this._spl) return this._spl;\n    const a = this._splashWord('DATA FARMING'), b = this._splashWord('SIMULATOR');\n    this._spl = a.join('\\n') + '\\n\\n' + b.join('\\n');\n    return this._spl;\n  }\n  // The splash lasts EXACTLY as long as the key or the button is held — pointer or ENTER alike.\n  /* DEFUNCT STATE TRANSFER. Cheikh, 2026-07-29: on being acquired, offer to save the state and\n     load it into an EARLIER version of the system — \"use older software to run defunct game state\".\n     It is the one thing that makes the version scroller load-bearing instead of a museum: the\n     acquisition does not end a save, it declares it obsolete, and obsolete software is where\n     obsolete states run. Written under a key of its own so nothing can overwrite the live save. */\n  legacyTarget() {\n    const V = (window.DFS && window.DFS.versions) || [];\n    if (!V.length) return null;\n    // the oldest listed build that actually has an export, else the oldest listed at all\n    for (let i = V.length - 1; i >= 0; i--) if (V[i].file) return V[i];\n    return V[V.length - 1];\n  }\n  transferLegacy = () => {\n    const g = this.g, t = this.legacyTarget();\n    this.click('sign');\n    if (!t) return;\n    const key = 'dfs.legacy.' + t.id;\n    try {\n      localStorage.setItem(key, JSON.stringify(Object.assign({}, g, { legacyFrom: this.BUILD_ID, legacyAt: Date.now() })));\n      this.legacyDone = key;\n    } catch(_) { this.legacyDone = 'FAILED'; }\n    this.setState({});\n    if (t.file) setTimeout(() => { try { window.open(t.file, '_blank'); } catch(_) {} }, 400);\n  };\n  signDown = () => { this._spl = null; this.signSplash = true; this.setState({}); };\n  signUp = () => { if (!this.signSplash) return; this.signSplash = false; this.setState({}); this.signAcq(); };\n  signAcq = () => {\n    const g = this.g, keep = {liquidity: g.liquidity + (g.acqGain||1), acq: g.acq+1, licenses: g.licenses, tele: g.tele, audioOwned: g.audioOwned, firedTotal: (g.firedTotal||0) + this.firedCount(), poems: g.poems||0, met: g.metMario, minds: g.minds||0, qd: g.qd||{}, inv: (g.mario.inv||[]).slice(), marioHired: g.mario.hired, marioStats: {fixed:g.mario.fixed, breaks:g.mario.breaks, dist:g.mario.dist, guilt:g.mario.guilt||0, wallet:g.mario.wallet||0, dmt:!!g.mario.dmt},\n      // his POSITION IN SPACE AND TIME survives the sale. The company changed hands; he did not move.\n      where: this.floor ? { fl:this.floor.fl||0, side:this.floor.side||0, px:this.floor.px||46 } : null, mx: g.mario.x||0};\n    const f = this.freshState();\n    f.liquidity = keep.liquidity; f.acq = keep.acq; f.licenses = keep.licenses; f.tele = keep.tele; f.audioOwned = keep.audioOwned;\n    f.consent = -1; f.money = 10 * keep.liquidity; f.gen = Math.max(0, this.g.gen - 4);\n    if (keep.marioHired) { f.mario.hired = true; f.mario.fixed = keep.marioStats.fixed; f.mario.breaks = keep.marioStats.breaks; f.mario.dist = keep.marioStats.dist; f.mario.guilt = keep.marioStats.guilt; f.mario.wallet = keep.marioStats.wallet; f.mario.dmt = keep.marioStats.dmt; f.mario.task = 'retained by the new owner. He does not comment.'; }\n    f.mario.inv = keep.inv.slice();\n    f.mario y.');} };\n  submitFilePick = () => { this.click(); if (this.fileRef.current) this.fileRef.current.click(); };\n  submitFile = (e) => {\n    const file = e.target.files && e.target.files[0]; if (!file) return;\n    const rd = new FileReader();\n    rd.onload = () => {\n      try {\n        const g = JSON.parse(rd.result);\n        if (g.v !== 1) throw new Error('wrong era');\n        const f = this.freshState();\n        const merged = Object.assign(f, g);\n        merged.mario = Object.assign(f.mario, g.mario || {});\n        merged.keys = Object.assign({last:'',streak:0,granted:null,grantT:0,salt:1,revealed:false}, g.keys || {});\n        merged.audioOn = false; merged.acqOpen = g.acqOpen || false;\n        this.g = merged; this.save();\n        this.say('ARTICLE 20 REQUEST FULFILLED. A file has been submitted. You are now whoever this is.');\n      } catch(err) { this.say('The file was refused. It did not look like anyone.'); }\n      this.setState({});\n    };\n    rd.readAsText(file);\n    e.target.value = '';\n  };\n  requestFile = () => {\n    this.click(); this.save();\n    try {\n      const raw = localStorage.getItem(this.saveKey()) || JSON.stringify(this.g);\n      const blob = new Blob([raw], {type:'application/json'});\n      const u = URL.createObjectURL(blob);\n      const el = document.createElement('a'); el.href = u; el.download = 'file-of-record-T' + Math.floor(this.g.t) + '.json';\n      document.body.appendChild(el); el.click(); el.remove();\n      setTimeout(() => URL.revokeObjectURL(u), 2000);\n      this.say('ARTICLE 15 REQUEST FULFILLED. Your file has been provided. It knows more than you told it.');\n    } catch(e) { this.say('Your file could not be provided. It is currently being used.'); }\n    this.setState({});\n  };\n  hardResetArm = () => { this.click(); if(this.resetArmed){ try{localStorage.removeItem(this.saveKey());}catch(e){} this.g=this.freshState(); this.resetArmed=false; this.say('Everything is forgotten. Nothing is forgiven.'); } else { this.resetArmed=true; setTimeout(()=>{this.resetArmed=false; this.setState({});},3000); } this.setState({}); };\n  consentAccept = () => { const g=this.g; this.click('sign'); const bonus=2*g.consent; g.consent=-1; g.users+=3+bonus; g.money+=0.04; this.say('Consent recorded. Consent resold ($0.04). You are USER #0. Welcome to your farm.'); };\n  /* TEN LAYERS. Deepening the banner changes SCRIPT — Arabic, Sanskrit, Hebrew, Japanese, Korean,\n     Chinese — and from layer 3 the clauses are M.'s poems in translation, dressed in clause numbers\n     and retention percentages so the thing reads as the saturation contract. It is not the contract.\n     Nobody is told this; the fourth wall stays procedural (CLAUDE.md §10). The layout is IDENTICAL\n     to a real clause list, which is the whole trick: his lines are hidden in plain administrative\n     sight, and the only tell is that they are beautiful. */\n  /* One cascade at a time, and it owns no input: the overlay is pointer-events:none throughout, so\n     a click during it lands on the desk underneath. You are not being asked. */\n  startCascade() {\n    if (this.casc) return;\n    this.casc = { t: 0, n: 1, out: 0, sat: this.g.sat || 0 };\n    this.ping('note');\n    try { this.blip(210); } catch(_) {}\n  }\n  cascadeCards() {\n    if (!this.casc) return [];\n    const N = this.NAR(), C2 = this.TUNE.cascade || {};\n    const dx = C2.offsetX == null ? 34 : C2.offsetX, dy = C2.offsetY == null ? 26 : C2.offsetY;\n    const body = (N.cascadeBody || 'SATURATION HAS REACHED {SAT}%.').replace('{SAT}', (Math.round((this.casc.sat||0)*10)/10).toFixed(1));\n    const out = [];\n    for (let i = 0; i < this.casc.n; i++) {\n      out.push({\n        key: 'c' + i,\n        left: (6 + i*dx) + 'px', top: (6 + i*dy) + 'px',\n        z: String(80 + i),\n        op: (1 - i*0.045).toFixed(3),\n        title: N.cascadeTitle || 'WE VALUE YOUR PRIVACY',\n        body: body,\n      });\n    }\n    return out;\n  }\n  consentText()
