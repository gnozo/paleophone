mple by its clearance from every connector, then greedily take n samples\n     that are far from the connectors AND from each other.\n     Placement can never fully solve the overlap — the squeeze windows are ±72 px around connectors\n     spaced 84 px apart, so they cover the whole wall. The invariant is the priority rule in\n     floorFrame: a connector in range always wins F. This only keeps the DOORS off the mouths. */\n  officeX(i) {\n    const W = this.worldW(), n = this.officeCount(), RPF = this.rpf(), fl = this.floor ? (this.floor.fl||0) : 0;\n    const key = W + ':' + RPF + ':' + fl + ':' + n + ':' + (this.g.racks||0);\n    if (this._offXKey !== key) {\n      this._offXKey = key;\n      const nRack = Math.max(0, Math.min(RPF, (this.g.racks||0) - fl*RPF));\n      const cons = [];\n      for (let c = 0; c < nRack; c++) { const x = this.rackPosX(c); if (cons.indexOf(x) < 0) cons.push(x); }\n      const lo = 24, hi = Math.max(lo + 1, W - 20);\n      const samples = [];\n      for (let x = lo; x <= hi; x += 6) {\n        let d = 999;\n        for (const c of cons) d = Math.min(d, Math.abs(x - c));\n        samples.push({ x, d });\n      }\n      samples.sort((a, b) => b.d - a.d);\n      const picked = [];\n      const minApart = Math.max(30, Math.min(70, Math.floor((hi - lo)/(n + 1))));\n      for (const sm of samples) {\n        if (picked.length >= n) break;\n        if (picked.every(p => Math.abs(p - sm.x) >= minApart)) picked.push(sm.x);\n      }\n      // if the wall is too tight to space them, relax the separation rather than stack them\n      for (let sep = minApart - 6; picked.length < n && sep > 6; sep -= 6) {\n        for (const sm of samples) {\n          if (picked.length >= n) break;\n          if (picked.every(p => Math.abs(p - sm.x) >= sep)) picked.push(sm.x);\n        }\n      }\n      this._offX = picked.sort((a, b) => a - b);\n    }\n    return this._offX[Math.min(i, Math.max(0, this._offX.length - 1))];\n  }\n  officeId(fl, side, i) { return fl + ':' + side + ':' + i; }\n  // 3-12 — floor, side, room. A number, and nothing that says what is behind it.\n  officePlate(fl, side, i) {\n    const K = (this.NAR().sideKanji) || ['\\u7532','\\u4e19','\\u4e59','\\u4e01'];\n    return (fl + 1) + '-' + (side + 1) + '-' + String((i + 1)*2 + 8).padStart(2, '0') + ' ' + (K[side] || '');\n  }\n  officeOpenCount() {\n    const g = this.g, O = this.OFF();\n    if (!g.racksUnlocked || (g.racks||0) < (O.firstOpenAt == null ? 1 : O.firstOpenAt)) return 0;\n    return 1 + (O.openPerPhase == null ? 2 : O.openPerPhase)*(g.phase||0) + ((g.acq||0) ? 2 : 0);\n  }\n  // which doors give is DETERMINED, not random per look: a door that gave once keeps giving.\n  officeOpen(fl, side, i) {\n    const idx = (fl*4 + side)*this.officeCount() + i;\n    let v = (Math.imul(idx + 1, 2654435761) ^ 0x27d4eb2f) >>> 0;\n    v ^= v>>>15; v = Math.imul(v, 2246822519) >>> 0; v = (v ^ (v>>>13)) >>> 0;\n    return (v % 97) < Math.min(97, this.officeOpenCount()*9);\n  }\n  officeKeys() { const g = this.g; return g.offKeys || (g.offKeys = {}); }\n  hasKey(k) { return !k || !!this.officeKeys()[k]; }\n  /* ---------- O-08 THE PHYSICAL RECURSION ----------------------------------------\n     The office floods with paper in proportion to the notifications you have not processed, so the\n     friction meter stops being a number in a bar and becomes a room you have to wade through. The\n     auto-reply agents are in there working — and their answers are themselves correspondence,\n     which is the recursion CLAUDE.md §7 asks for, stated by the furniture rather than by a joke.\n     O-10: the MAGNETIC RING surfaces in the drift once it is deep enough. It is \"worn on the hand\n     that signs\", so it is found in the correspondence, never in a drawer.                     */\n  PAP() { return (this.TUNE.paper) || {}; }\n  paperDepth() {\n    const g = this.g, P = this.PAP();\n    const items = (g.piles||[]).reduce((a,p) => a + (p.count||0), 0);\n    if (items <= 0) return 0;\n    return Math.min(P.maxDepth == null ? 96 : P.maxDepth,\n      Math.log10(1 + items) * (P.perDecade == null ? 26 : P.perDecade));\n  }\n  paperWadeMult() {\n    const P = this.PAP(), d = this.paperDepth(), at = P.wadeAt == null ? 14 : P.wadeAt;\n    if (d <= at) return 1;\n    const over = (d - at) / Math.max(1, (P.maxDepth == null ? 96 : P.maxDepth) - at);\n    return 1 - Math.min(P.wadeMax == null ? 0.62 : P.wadeMax, over * (P.wadeMax == null ? 0.62 : P.wadeMax));\n  }\n  giveKey(k) {\n    const K = (this.NAR().keys || []).find(x => x.k === k); if (!K) return;\n    if (this.officeKeys()[k]) return;\n    this.officeKeys()[k] = 1;\n    this.fmsg(K.name + ' \\u2014 ' + (K.note||''), 3.4);\n    this.mlog('issued: ' + K.name.toLowerCase() + '.');\n    this.ping('good');\n  }\n  enterOffice(fl, side, i) {\n    const f = this.floor, g = this.g, N = this.NAR(), O = this.OFF();\n    if (!f) return;\n    f.office = {\n      id: this.officeId(fl, side, i), plate: this.officePlate(fl, side, i),\n      fl, side, i, x: 26, w: O.roomW == null ? 260 : O.roomW,\n      termX: (O.roomW == null ? 260 : O.roomW) - 54,\n      grab: 0, inside: false, prog: null, sel: 0, look: 0,\n      // the entry press is SWALLOWED — arriving on a held F must not immediately open the drawer\n      // and hand over the credential. Same law as the alleys (S.fPrev starts true, v0.50).\n      fPrev: true,\n      // the first office you ever open has the card in its drawer, unlocked like everything here\n      drawer: !(g.offKeys && g.offKeys.card),\n    };\n    f.vx = 0; f.py = 0; f.vy = 0; f.ground = true; f.stepUp = null;\n    // the first officeFrame runs on the NEXT animation frame, before any re-render has happened, so\n    // everything it reads must exist now. It read f.office.look/x from an object that had them, but\n    // onProp/conduit/slide belong to the hall and were still set — the room drew a grinding, propped\n    // body in a black box and then the hall's own state fought it. Clear the hall out of him.\n    f.onProp = false; f.conduit = false; f.slide = null; f.slip = null;\n    f.crouch = false; f.tuck = false; f.pop = 0; f.air = 0; f.bail = 0; f.fixT = 0; f.fixIdx = -1;\n    f.keys.l = f.keys.r = f.keys.j = f.keys.dn = false;\n    g.qd = g.qd || {}; g.qd.q_office = 1;\n    this.fmsg(this.rnd(N.officeEnter || ['the door gives.']), 3.2);\n    this.transBurst = Math.max(this.transBurst||0, 0.45);\n    this.setState({});\n  }\n  leaveOffice() {\n    const f = this.floor; if (!f || !f.office) return;\n    f.office = null; f.vx = 0; f.ground = true;\n    this.fmsg('back into ' + (this.SIDES[f.side||0] || 'the hall') + '.');\n    this.setState({});\n  }\n  /* Inside a room. The platformer keeps running — same body, same physics, a smaller world — and\n     the terminal is an object you walk to. Sitting down is not a menu: something leaves the glass\n     and takes the shape of his head, settles, and THEN the desktop exists. */\n  /* THE SPRITE, once. It used to live inline in floorFrame only, and the office drew its own\n     \"compact read\" of him from the same palette — which produced a caricature: a flat brown head\n     block with a pink mouth bar and no glasses, nothing like the man in the hall. Cheikh, rightly,\n     called it out. There is now exactly one M., drawn here, called from both places, in the same\n     world units under the same camera. If he needs to change, he changes once.\n     `o`: { bob, fd, tilt, bdx, kneel, idlePoet, seated } — seated is the office's only variation. */\n  drawMario(ctx, f, mx, my, o) {\n    const A = (this.ART && this.ART.mario) || {};\n    const bob = o.bob || 0, fd = o.fd || 1, seated = !!o.seated;\n    const bdx = o.bdx || 0, tilt = o.tilt || 0, idlePoet = !!o.idlePoet;\n    // the board: leaned against the desk when he is seated, under his feet otherwise\n    if (seated) { ctx.fillStyle = A.board || '#3a2f26'; ctx.fillRect(mx + 8, my - 16, 3, 16); }\n    else {\n    ctx.save(); ctx.translate(mx + bdx, my - 3); ctx.rotate(tilt);\n    ctx.fillStyle = '#e0485a'; ctx.fillRect(-9, -1, 18, 2);\n    ctx.fillStyle = '#e8707e'; ctx.fillRect(-10, -2, 2, 1); ctx.fillRect(8, -2, 2, 1);\n    ctx.fillStyle = '#f2b8be'; ctx.fillRect(-3, -1, 6, 1);\n    ctx.fillStyle = '#f5f2ea'; ctx.fillRect(-6, 1, 3, 2); ctx.fillRect(3, 1, 3, 2);\n    ctx.restore();\n    }\n    ctx.save();\n    if (f.bail > 0) { ctx.translate(mx, my-12); ctx.rotate((0.55 - f.bail) * 11 * fd); ctx.translate(-mx, -(my-12)); }\n    const kneel = !!o.kneel;\n    const bodyY = my - (kneel || seated ? 20 : (f.pop > 0 ? 24 : 27)) + bob;\n    // slim trousers, pointed shoes\n    ctx.fillStyle = (this.ART.mario&&this.ART.mario.trousers)||'#41506b'; ctx.fillRect(mx-3, bodyY+14, 2, kneel ? 3 : 9); ctx.fillRect(mx+2, bodyY+14, 2, kneel ? 3 : 9);\n    ctx.fillStyle = (this.ART.mario&&this.ART.mario.shoes)||'#6b5a3d'; ctx.fillRect(mx-4, my-6+bob, 3, 2); ctx.fillRect(mx+2, my-6+bob, 4, 2);\n    // dark turtleneck under an OPEN hi-vis\n    ctx.fillStyle = '#14121a'; ctx.fillRect(mx-4, bodyY+4, 8, 10);\n    ctx.fillStyle = '#ff7a1a'; ctx.fillRect(mx-5, bodyY+4, 3, 10); ctx.fillRect(mx+2, bodyY+4, 3, 10);\n    ctx.fillStyle = '#e8e2d6'; ctx.fillRect(mx-5, bodyY+8, 3, 1); ctx.fillRect(mx+2, bodyY+8, 3, 1);\n    // head: hair top + back of head, chin up\n    ctx.fillStyle = '#5a3a26'; ctx.fillRect(mx-3, bodyY-4, 7, 7);\n    ctx.fillStyle = '#0e0c0a'; ctx.fillRect(mx-3, bodyY-5, 7, 2);\n    ctx.fillRect(fd > 0 ? mx-4 : mx+3, bodyY-5, 2, 7);\n    // rectangular glasses, teal\n    ctx.fillStyle = '#7de0e0'; ctx.fillRect(mx-3+fd, bodyY-1, 3, 2); ctx.fillRect(mx+1+fd, bodyY-1, 3, 2);\n    ctx.fillStyle = '#0b0b0c'; ctx.fillRect(mx+fd, bodyY-1, 1, 2);\n    if (f.think) { ctx.fillStyle = '#e8e2d6'; ctx.fillRect(mx+6, bodyY-13, 13, 8); ctx.fillRect(mx+4, bodyY-5, 3, 2); ctx.fillStyle = '#1a1713'; ctx.font = '6px monospace'; ctx.fillText('...', mx+9, bodyY-12); }\n    if (kneel) { ctx.fillStyle = '#5a3a26'; ctx.fillRect(mx+ || 'something metal in the drift.', 2.6);\n        this.giveKey('ring');\n      }\n      if (!inp) f.vx *= 0.84;\n      R.x = Math.max(10, Math.min(R.w - 10, R.x + f.vx*dt));\n      if (R.x <= 11 && inp < 0) { this.leaveOffice(); return; }\n      // the drawer: the credential is in it, and it was never locked\n      if (R.drawer && Math.abs(R.x - 34) < 16 && f.keys.f && !R.fPrev) { R.drawer = false; this.giveKey('card'); }\n      // sitting down\n      if (Math.abs(R.x - R.termX) < 20 && f.keys.f && !R.fPrev) {\n        R.grab = O.grabSeconds == null ? 1.35 : O.grabSeconds;\n        this.fmsg(N.termSit || 'he sits.', 2.6);\n        this.mlog(this.rnd(N.termGrab || ['something leaves the glass.']));\n        this.blip(90);\n      }\n      R.fPrev = f.keys.f;\n    }\n\n    /* SAME SCALE, SAME GEOMETRY AS THE HALL. The room used to invent its own factor —\n       max(1.4, min(vw/(w+40), vh/150)), which lands at 4–6x on a desktop — so a 30-unit monitor\n       drew 150px tall and the body drew at a size that exists nowhere else in the game. It now uses\n       marioScale() and a world-unit camera exactly like floorFrame: 1 unit here is 1 unit there. */\n    const sc = 1;\n    const S2 = this.marioScale(vw, vh), viewW2 = vw/S2, viewH2 = vh/S2;\n    const gy = 120;\n    const camX2 = Math.max(-20, Math.min(R.w + 20 - viewW2, R.x - viewW2/2));\n    const camY2 = gy - viewH2*0.62;\n    ctx.setTransform(1,0,0,1,0,0);\n    ctx.fillStyle = '#040404'; ctx.fillRect(0, 0, vw, vh);\n    ctx.setTransform(S2, 0, 0, S2, Math.round(-camX2*S2), Math.round(-camY2*S2));\n    ctx.imageSmoothingEnabled = false;\n    const ox = 0;\n    // the screen's own glow is the room's only light\n    const glow = ctx.createRadialGradient(ox + R.termX*sc, gy - 26*sc, 4, ox + R.termX*sc, gy - 26*sc, 130*sc);\n    glow.addColorStop(0, 'rgba(120,180,200,.30)'); glow.addColorStop(1, 'rgba(0,0,0,0)');\n    ctx.fillStyle = glow; ctx.fillRect(0, 0, vw, vh);\n    ctx.fillStyle = '#0c0c0e'; ctx.fillRect(camX2 - 10, gy, viewW2 + 20, viewH2);\n    ctx.fillStyle = '#141416'; ctx.fillRect(camX2 - 10, gy, viewW2 + 20, 1);\n    // desk + terminal\n    const tx = ox + R.termX*sc;\n    ctx.fillStyle = '#17171a'; ctx.fillRect(tx - 26*sc, gy - 15*sc, 52*sc, 15*sc);\n    ctx.fillStyle = '#0a0c0f'; ctx.fillRect(tx - 15*sc, gy - 40*sc, 30*sc, 25*sc);\n    ctx.fillStyle = R.inside ? '#3fd98f' : '#1d5c6b';\n    ctx.fillRect(tx - 12*sc, gy - 37*sc, 24*sc, 19*sc);\n    for (let sl = 0; sl < 6; sl++) { ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(tx - 12*sc, gy - 37*sc + sl*3.2*sc, 24*sc, 1); }\n    // the drawer, if it still holds anything\n    if (R.drawer) {\n      ctx.fillStyle = '#1b1b1e'; ctx.fillRect(ox + 22*sc, gy - 13*sc, 24*sc, 13*sc);\n      ctx.fillStyle = ((f.t*2)%1) < 0.5 ? '#ffd27a' : '#584a2a'; ctx.fillRect(ox + 32*sc, gy - 7*sc, 4*sc, 2*sc);\n    }\n    /* O-08 — THE DRIFT. Paper, in proportion to what you have not processed, and the auto-reply\n       agents working in it. Their answers are themselves correspondence: the recursion IS the\n       feature (CLAUDE.md §7), stated by the furniture rather than told as a joke. Drawn after the\n       desk so it buries the desk, and before the plate so the plate stays legible. */\n    {\n      const _pd = this.paperDepth();\n      if (_pd > 0.5) {\n        const P = this.PAP(), N2 = this.NAR();\n        const dpx = _pd*sc, x0 = camX2 - 12, x1 = camX2 + viewW2 + 12;\n        // the mass, with a drifted surface rather than a level\n        ctx.fillStyle = '#cfc7b6';\n        ctx.beginPath(); ctx.moveTo(x0, gy);\n        for (let x = x0; x <= x1; x += 6*sc) {\n          const u = (x - x0)/Math.max(1, x1 - x0);\n          const surf = gy - dpx*(0.55 + 0.45*Math.sin(u*7.3 + 1.1) * Math.sin(u*2.1 + 0.3));\n          ctx.lineTo(x, surf);\n        }\n        ctx.lineTo(x1, gy); ctx.closePath(); ctx.fill();\n        // individual sheets at the surface, so it reads as paper and not as snow\n        ctx.strokeStyle = 'rgba(120,112,98,.5)  { for (let v4 = 0; v4 < 4; v4++) ctx.fillRect(gx + gw*(0.1 + v4*0.22), gy2 + gh2*0.2, Math.max(1, gw*0.12), Math.max(1, gh2*0.6)); }\n        else ctx.fillRect(gx + gw*0.18, gy2 + gh2*0.3, Math.max(1, gw*0.46), Math.max(1, gh2*0.34));\n        // V-02 — twice the pixels on every machine: a row of status LEDs, a vent grille and a\n        // label plate per sector, so the alley reads as equipment rather than as coloured boxes.\n        const led = Math.max(1, Math.round(PX*0.22));\n        for (let q2 = 0; q2 < 4; q2++) {\n          const on2 = ((f.t*(2 + q2) + si*1.7 + fx.seed) % 1) < 0.5;\n          ctx.fillStyle = sbad ? (on2 ? '#ff6a52' : '#4a1410') : (on2 ? '#2fa87a' : '#12332a');\n          ctx.fillRect(gx + gw*0.12 + q2*led*2, gy2 + gh2*0.82, led, led);\n        }\n        ctx.fillStyle = 'rgba(0,0,0,.45)';\n        for (let v3 = 0; v3 < 5; v3++) ctx.fillRect(gx + gw*0.58 + v3*Math.max(1, PX*0.2), gy2 + gh2*0.18, Math.max(1, Math.round(PX*0.1)), Math.max(1, gh2*0.42));\n        ctx.fillStyle = 'rgba(217,207,174,.28)';\n        ctx.fillRect(gx + gw*0.12, gy2 + gh2*0.1, Math.max(1, gw*0.3), Math.max(1, Math.round(PX*0.16)));\n      }\n      const near = Math.abs(fx.x - S.x) < U.reachX;\n      if (bad || near) {\n        ctx.fillStyle = bad ? '#ffd27a' : 'rgba(160,180,200,.5)';\n        ctx.font = Math.max(8, Math.min(14, Math.round(PX*1.2))) + 'px monospace'; ctx.textAlign = 'center';\n        ctx.fillText(bad ? ('TAP \\u2014 ' + fx.name) : fx.name, x0 + w/2, y0 - 5);\n        ctx.textAlign = 'left';\n      }\n    }\n    // static boxes (not movable — they are what you stand on)\n    for (const p of S.plat) {\n      const w = p.w*PX, x0 = SX(p.x) - w/2, ytop = SY(p.top), hgt = floorY - ytop;\n      if (x0 + w < -30 || x0 > vw + 30) continue;\n      if (p.table) {        ctx.fillStyle = '#3a3630'; ctx.fillRect(x0, ytop, Math.max(2,w), Math.max(2, PX*0.5));\n        ctx.fillStyle = '#514a41'; ctx.fillRect(x0, ytop, Math.max(2,w), Math.max(1,2));\n        ctx.fill continue;\n      const th = Math.max(1.5, Math.round((rl.thick || U.cableThick)*PX));\n      // the tray follows the cable line (a loop climbs)\n      ctx.strokeStyle = rl.hi ? '#59657a' : '#46505f'; ctx.lineWidth = Math.max(1, th*0.5);\n      ctx.beginPath();\n      for (let wx = rl.x0; wx <= rl.x1; wx += Math.max(2, U.body*0.25)) {\n        const yy = SY(this.railY(rl, wx, U));\n        if (wx === rl.x0) ctx.moveTo(SX(wx), yy); else ctx.lineTo(SX(wx), yy);\n      }\n      ctx.stroke();\n      // the octopus: a varying number of bundles, each hanging a little lower than the last\n      const allc = (this.ART && this.ART.cablePalette) || ['#8a6a28','#2a6e7a','#8a2f45','#3f7a4c','#6a4a80','#8d8677','#4a5a8a'];\n      const _ca = (this.ART && this.ART.cableAlpha != null) ? this.ART.cableAlpha : 0.72;\n      const _cw = Math.max(1, U.gauge*PX);   // the one gauge, shared with the loops\n      const nb2 = rl.bundles || 5;\n      const entry = Math.min((rl.x1 - rl.x0)*0.12, U.body*0.7);\n      for (let c2 = 0; c2 < nb2; c2++) {\n        ctx.strokeStyle = allc[((rl.pal||0) + c2) % allc.length];\n        ctx.globalAlpha = _ca; ctx.lineWidth = _cw;\n        ctx.beginPath();\n        for (let wx = rl.x0; wx <= rl.x1; wx += Math.max(2, U.body*0.22)) {\n          // taper the hang to nothing at both ends: the bundle meets the plate flush\n          const edge = Math.min(1, Math.min(wx - rl.x0, rl.x1 - wx)/Math.max(1, entry));\n          const yy = SY(this.railY(rl, wx, U)) + edge*((c2 + 1)*Math.max(1, th*0.5) + Math.sin(wx*0.02 + rl.seed + c2*1.6)*th*0.45);\n          if (wx === rl.x0) ctx.moveTo(SX(wx), yy); else ctx.lineTo(SX(wx), yy);\n        }\n        ctx.stroke();\n      }\n      ctx.globalAlpha = 1;\n      // the junction plates: where the run terminates in a machine\n      for (const ex of [rl.x0, rl.x1]) {\n        const jx = SX(ex), jy = SY(this.railY(rl, ex, U));\n        const jw = Math.max(3, th*2.2), jh = Math.max(4, th*3.4);\n        ctx.fillStyle = '#20262f'; ------ actions ----------\n  /* One keyboard for the whole desk: the same instrument at each control's own semitone, two\n     octaves above the harvest note. Every click used to be an unrelated beep, and the\n     automated-harvest row had no voice at all. */\n  uiClick(id) {\n    const C = this.actx; if (!C || !this.g.audioOn) return;\n    const U = (this.TUNE && this.TUNE.ui) || {}, N = U.notes || {};\n    const st = (N[id] == null ? (N.generic == null ? 8 : N.generic) : N[id]);\n    const t = C.currentTime;\n    if (this._uiAt && t - this._uiAt < 0.02) return;\n    this._uiAt = t;\n    const o = C.createOscillator(), g2 = C.createGain(), lp = C.createBiquadFilter();\n    const dec = U.decay || 0.085;\n    o.type = U.wave || 'triangle';\n    o.frequency.value = (U.baseHz || 293.66) * Math.pow(2, st/12);\n    lp.type = 'lowpass'; lp.frequency.value = U.cutoff || 3200; lp.Q.value = 0.7;\n    g2.gain.setValueAtTime(0, t);\n    g2.gain.linearRampToValueAtTime(U.gain == null ? 0.34 : U.gain, t + 0.004);\n    g2.gain.exponentialRampToValueAtTime(0.0001, t + dec);\n    o.connect(lp); lp.connect(g2); g2.connect((this.fAudio && this.fAudio.master) || this.master || C.destination);\n    o.start(t); o.stop(t + dec + 0.02);\n  }\n  click(id) { this.lastInput = Date.now(); this.g.tele.clicks++; this.g.tele.recent=(this.g.tele.recent||0)+1; try { this.uiClick(id); } catch(_) {} }\n  harvest = () => { const g=this.g; this.click('harvest'); if(g.audit&&g.audit.seal==='harvest')return; this.harvTone(); g.harvests=(g.harvests||0)+1; const _amt = 0.025*g.clickPower*(1+g.liquidity*0.02); g.data += _amt; g.dataHuman = (g.dataHuman||0) + _amt; this.hclick(); };\n  /* PUBLISH. The remedy for an administrative backlog is a content calendar, and the content\n     calendar generates administration. Brand equity absorbs part of the drag and decays on its own,\n     so it is a treadmill rather than an upgrade — which is the honest model of the thing. */\n  postContent = () => {\n    const g
