document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"78d0205f-e27e-463d-838a-68e3a7b14bc5\"><\u002Fscript>\n</head>\n<body>\n<x-dc>\n<helmet>\n<title>Data Farming Simulator</title>\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<style>\nbody{margin:0;background:#ffffff;color:#0b0b0c;font-family:'Courier New',ui-monospace,Menlo,monospace;}\na{color:#067a68;text-decoration:underline;} a:hover{color:#00ffcc;background:#0b0b0c;}\n::selection{background:#00ffcc;color:#0b0b0c;}\nbutton{font-family:inherit;} button:disabled{opacity:.32;cursor:not-allowed;}\n/* THE POINTER. A thick cross, drawn, with a white keyline so it survives both the white desk and\n   the black modes — the default crosshair is a hairline that vanishes on either. */\nbody,button{cursor:url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='23' height='23'><g><rect x='9' y='0' width='5' height='23' fill='white'/><rect x='0' y='9' width='23' height='5' fill='white'/><rect x='10' y='1' width='3' height='21' fill='%230b0b0c'/><rect x='1' y='10' width='21' height='3' fill='%230b0b0c'/></g></svg>\") 11 11, crosshair;}\n/* The desk columns must reach the bottom of the tallest one whatever they contain: the last\n   VISIBLE block in each takes the slack. Structural, not decorative — it cannot be expressed\n   inline because which block is last depends on which sc-ifs are open, and that changes as the\n   farm grows. One selector, in the helmet, so it paints with the first frame. */\n[data-fillcol]>*:last-child{flex:1 1 auto;}\n/* And a column whose blocks are ALL behind false sc-ifs must leave the grid entirely, or the\n   stretch above hands it the full row height and it paints as a tall white cell — worse than the\n   gap it was fixing. `:not(:has(*))` rather than `:empty`, which fails the moment the compiled\n   markup carries a whitespace text node. Which columns are empty changes as the farm grows, so\n   this has to be structural rather than a per-phase fix. */\n[data-fillcol]:not(:has(*)){display:none;}\n@keyframes dfsblink{0%,100%{opacity:1}50%{opacity:.2}}\n@keyframes dfsflick{0%,93%,100%{opacity:1}94%{opacity:.4}96%{opacity:.85}98%{opacity:.5}}\n@keyframes dfsshine{0%{background-position:-120px 0}100%{background-position:200px 0}}\n@keyframes dfssweep{0%{background-position:0% 50%}100%{background-position:300% 50%}}\n@keyframes dfsneuro{0%{background-position:-120px 0}100%{background-position:200px 0}}\n</style>\n<script src=\"a098ce28-1cbd-42a4-8fda-376ca358d4d4\"><\u002Fscript>\n<script src=\"e8410b95-0ea6-4c06-a8dd-a3351c016def\"><\u002Fscript>\n<script src=\"978f68f8-9674-4bb3-b774-0b2b95564a6c\"><\u002Fscript>\n<script src=\"fa79916f-c65e-4fb8-82cb-daf1f84e3309\"><\u002Fscript>\n<script src=\"a71d5a0c-62c0-4c70-9e49-7d953bc1dda8\"><\u002Fscript>\n<script src=\"245d2787-f632-44b1-9944-28c3d495f43c\"><\u002Fscript>\n<script src=\"ad66219b-9bb2-4ee9-93b6-9557fb077309\"><\u002Fscript>\n</helmet>\n<div data-decay-root=\"1\" style=\"min-height:100vh;background:{{ skinBg }};color:{{ skinInk }};--boxbg:{{ boxBg }};--boxrad:{{ boxRad }};--boxsh:{{ boxSh }};font-family:{{ skinFont }};letter-spacing:{{ skinSpace }};padding:16px 16px 168px;box-sizing:border-box;cursor:{{ skinCursor }};\">\n<sc-if value=\"{{ clinicalOn }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-no-decay=\"1\" style=\"position:fixed;top:0;left:0;right:0;bottom:0;z-index:99;background:#f4f2ed;color:#0b0b0c;display:flex;align-items:center;justify-content:center;padding:24px;font-family:'Courier New',ui-monospace,Menlo,monospace;letter-spacing:0;\">\n<div style=\"max-width:420px;display:flex;flex-direction:column;gap:14px;\">\n<div style=\"font-size:10px;letter-spacing:.28em;opacity:.55;\">{{ clinHalt }}</div>\n<div style=\"font-size:13px;line-height:1.6;text-wrap:pretty;\">{{ clinReason }}</div>\n<div style=\"border-top:1px solid #0b0b0c;padding-top:14p st=\"{{ hintItems }}\" as=\"hi\" hint-placeholder-count=\"3\">\n<div style=\"font-size:10.5px;color:#cfc7b6;line-height:1.55;\">— {{ hi.txt }}</div>\n</sc-for>\n</div>\n</div>\n</sc-if>\n\n<sc-if value=\"{{ verShow }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-no-decay=\"1\" style=\"position:fixed;bottom:44px;left:0;right:0;z-index:94;background:#0b0b0c;color:#cfc7b6;border-top:1px solid #3a352c;padding:12px 16px 14px;font-family:'Courier New',ui-monospace,Menlo,monospace;letter-spacing:0;\">\n<div style=\"display:flex;align-items:baseline;gap:12px;margin-bottom:8px;\">\n<div style=\"font-size:10px;letter-spacing:.22em;color:#e8e2d6;\">VERSIONS</div>\n<div style=\"font-size:9px;color:#8d8677;\">{{ verPos }}</div>\n<div style=\"font-size:9px;color:#6f6a5e;\">{{ verArchived }}</div>\n<sc-if value=\"{{ legacyInOn }}\" hint-placeholder-val=\"{{ false }}\">\n<button sc-camel-on-click=\"{{ loadLegacy }}\" data-no-decay=\"1\" title=\"{{ legacyIn }}\" style=\"font-size:10px;letter-spacing:.1em;padding:5px 10px;border:1px solid #0b0b0c;background:#ffd27a;color:#0b0b0c;cursor:pointer;\" style-hover=\"background:#0b0b0c;color:#ffd27a;\">ADOPT WAITING STATE</button>\n</sc-if>\n<button sc-camel-on-click=\"{{ verOpen }}\" style=\"margin-left:auto;font-family:inherit;font-size:10px;letter-spacing:.1em;padding:3px 9px;background:transparent;color:#8d8677;border:1px solid #3a352c;cursor:pointer;\" style-hover=\"color:#e8e2d6;\">CLOSE</button>\n</div>\n<div style=\"display:flex;align-items:stretch;gap:10px;\">\n<button sc-camel-on-click=\"{{ verPrev }}\" style=\"font-family:inherit;font-size:13px;padding:0 12px;background:transparent;color:#cfc7b6;border:1px solid #3a352c;cursor:pointer;\" style-hover=\"background:#3a352c;\">◀</button>\n<div style=\"flex:1;min-width:0;\">\n<div style=\"display:flex;align-items:baseline;gap:10px;\">\n<div style=\"font-size:13px;color:#ffd27a;font-weight:700;\">{{ verId }}</div>\n<div style=\"font-size:11px;color:#e8e2d6;\">{{ verTitle }}</div> ,#ffffff);padding:8px 10px;\">\n<div style=\"display:flex;align-items:baseline;gap:8px;\"><div style=\"font-size:10px;letter-spacing:.12em;font-weight:700;\">{{ pl.name }}</div><div style=\"margin-left:auto;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;animation:dfsflick 0.9s infinite;\">{{ pl.countFmt }}</div></div>\n<div style=\"font-size:9px;opacity:.6;\">{{ pl.rateNote }}</div>\n<div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;\">\n<button sc-camel-on-click=\"{{ pl.process }}\" style=\"font-size:10px;padding:4px 8px;border:1px solid #0b0b0c;background:#fff;cursor:pointer;\" style-hover=\"background:#0b0b0c;color:#fff;\">PROCESS 10</button>\n<sc-if value=\"{{ pl.canHire }}\" hint-placeholder-val=\"{{ false }}\">\n<button sc-camel-on-click=\"{{ pl.hire }}\" disabled=\"{{ pl.hireDisabled }}\" style=\"font-size:10px;padding:4px 8px;border:1px solid #0b0b0c;background:#fff;cursor:pointer;\" style-hover=\"background:#0b0b0c;color:#fff;\">{{ pl.hireLabel }}</button>\n</sc-if>\n</div>\n</div>\n</sc-for>\n</div>\n<div style=\"font-size:10px;opacity:.6;margin-top:8px;\">{{ pressureNote }}</div>\n</div>\n</sc-if>\n\n<div style=\"border:1px solid #0b0b0c;border-radius:var(--boxrad,0px);box-shadow:var(--boxsh,none);background:var(--boxbg,#ffffff);padding:14px;\">\n<div style=\"font-size:11px;letter-spacing:.2em;font-weight:700;margin-bottom:10px;\">YOUR FILE</div>\n<sc-for list=\"{{ dossier }}\" as=\"d\" hint-placeholder-count=\"4\">\n<div style=\"display:flex;gap:8px;font-size:10px;line-height:1.7;border-bottom:1px dotted rgba(11,11,12,.25);\"><span style=\"opacity:.55;min-width:110px;\">{{ d.k }}</span><span style=\"font-weight:700;\">{{ d.v }}</span></div>\n</sc-for>\n<div style=\"font-size:9px;opacity:.5;margin-top:8px;\">{{ telemetryNote }}</div>\n</div>\n\n<sc-if value=\"{{ debtVisible }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"border:1px solid #0b0b0c;border-radius:var(--boxrad,0px);box-shadow:var(--boxsh,none);background:var(--boxbg,#ffffff);padding:14px;background:#0b0b0c;color:#fff;\">\n<div style=\"font-size:11px;letter-spacing:.2em;font-weight:700;margin-bottom:8px;\">INTERNAL CREDIT FACILITY</div>\n<div style=\"font-size:11px;line-height:1.7;\">outstanding: <b>{{ debtFmt }}</b><br><span style=\"opacity:.7;\">{{ debtNote }}</span></div>\n<div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;\">\n<button sc-camel-on-click=\"{{ buyLicense }}\" style=\"font-size:10px;padding:7px 10px;border:1px solid #fff;background:#0b0b0c;color:#fff;cursor:pointer;\" style-hover=\"background:#00ffcc;color:#0b0b0c;border:1px solid #00ffcc;\">{{ licenseLabel }}</button>\n<button sc-camel-on-click=\"{{ repayDebt }}\" disabled=\"{{ repayDisabled }}\" style=\"font-size:10px;padding:7px 10px;border:1px solid #fff;background:#0b0b0c;color:#fff;cursor:pointer;\" style-hover=\"background:#fff;color:#0b0b0c;\">REPAY ALL</button>\n</div>\n</div>\n</sc-if>\n\n<div style=\"border:1px solid #0b0b0c;border-radius:var(--boxrad,0px);box-shadow:var(--boxsh,none);background:var(--boxbg,#ffffff);padding:14px;\">\n<div style=\"font-size:11px;letter-spacing:.2em;font-weight:700;margin-bottom:10px;\">LEDGER</div>\n<div style=\"max-height:300px;overflow-y:auto;overscroll-behavior:contain;\">\n<sc-for list=\"{{ log }}\" as=\"l\" hint-placeholder-count=\"4\">\n<div style=\"font-size:10px;line-height:1.65;\"><span style=\"opacity:.45;\">{{ l.t }}</span> {{ l.msg }}</div>\n</sc-for>\n</div>\n</div>\n</div>\n<div style=\"grid-column:1/-1;border:1px solid #0b0b0c;border-radius:var(--boxrad,0px);box-shadow:var(--boxsh,none);background:var(--boxbg,#ffffff);padding:12px 14px;\">\n<div style=\"display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;\">\n<div style=\"font-size:10px;letter-spacing:.2em;font-weight:700;\">THE RETURN</div>\n<div style=\"font-size:10px;opacity:.62;\">← what the customers do to the herd</div>\n<div style=\"margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;font-weight:700;\">{{ overlapFmt }}</div>\n</div>\n<div style=\"font-size:10px;line-height:1.6;margin-top:6px;\">{{ overlapNote }}</div>\n<div style=\"font-size:10px;opacity:.62;line-height:1.6;margin-top:3px;\">{{ returnNote }}</div>\n</div>\n\n</div>\n\n<div style=\"position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #0b0b0c;padding:8px 16px;display:{{ footDisp }};flex-wrap:wrap;gap:14px;align-items:center;font-size:10px;z-index:60;\">\n<button sc-camel-on-click=\"{{ fullToggle }}\" style=\"font-size:10px;letter-spacing:.1em;padding:5px 10px;border:1px solid #0b0b0c;background:#fff;cursor:pointer;\" style-hover=\"background:#0b0b0c;color:#fff;\">⛶ FULLSCREEN</button>\n<sc-if value=\"{{ benchOn }}\" hint-placeholder-val=\"{{ false }}\">\n<button sc-camel-on-click=\"{{ tuneToggle }}\" data-no-decay=\"1\" style=\"font-size:10px;letter-spacing:.1em;padding:5px 10px;border:1px solid #0b0b0c;background:#fff;cursor:pointer;\" style-hover=\"background:#0b0b0c;color:#fff;\">{{ tuneBadge }}</button>\n</sc-if>\n<sc-if value=\"{{ legacyInOn }}\" hint-placeholder-val=\"{{ false }}\">\n<button sc-camel-on-click=\"{{ loadLegacy }}\" data-no-decay=\"1\" title=\"{{ legacyIn }}\" style=\"font-size:10px;letter-spacing:.1em;padding:5px 10px;border:1px solid #0b0b0c;background:#ffd27a;color:#0b0b0c;cursor:pointer;\" style-hover=\"background:#0b0b0c;color:#ffd27a;\">ADOPT WAITING STATE</button>\n</sc-if>\n<button sc-camel-on-click=\"{{ verOpen }}\" data-no-decay=\"1\" style=\"font-size:10px;letter-spacing:.1em;padding:5px 10px;border:1px solid #0b0b0c;background:#fff;cursor:pointer;\" style-hover=\"background:#0b0b0c;color:#fff;\">VERSIONS</button>\n<button sc-camel-on-click=\"{{ hintToggle }}\" data-no-decay=\"1\" style=\"font-size:10px;letter-spacing:.1em;padding:5px 10px;border:1px solid #0b0b0c;background:{{ hintBtnBg }};color:{{ hintBtnFg }};cursor:pointer;\">HINT</button>\n<sc-if value=\"{{ audioOwned }}\" hint-placeholder-val=\"{{ false }}\">\n<button sc-camel-on-click=\"{{ audioToggle }}\" style=\"font-size:10px;letter-spacing:.1em;padding:5px 10px;border:1px solid #0b0b0c;background:#fff;cursor:pointer;\" style-hover=\"background:#0b0b0c;color:#fff;\">{{ audioLabel }}</button>\n</sc-if>\n<span style=\"opacity:.85;\">{{ saveNote }}</span>\n<sc-if value=\"{{ orphanOn }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color:#d92f1e;font-weight:700;\">{{ orphanNote }}</span></sc-if>\n<span style=\"opacity:.85;\">{{ clockFmt }}</span>\n<sc-if value=\"{{ firedVisible }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"opacity:.85;\">workforce released to date: {{ firedFmt }}</span></sc-if>\n<span style=\"margin-left:auto;opacity:.85;\">a post-admin experience by <a href=\"https://paleophone.fr\">paleophone.fr</a></span>\n<button sc-camel-on-click=\"{{ requestFile }}\" style=\"font-size:9px;padding:3px 7px;border:1px dotted #0b0b0c;background:#fff;cursor:pointer;opacity:.85;\" style-hover=\"opacity:1;background:#0b0b0c;color:#fff;\">REQUEST MY FILE (ART. 15)</button>\n<button sc-camel-on-click=\"{{ submitFilePick }}\" style=\"font-size:9px;padding:3px 7px;border:1px dotted #0b0b0c;background:#fff;cursor:pointer;opacity:.85;\" style-hover=\"opacity:1;background:#0b0b0c;color:#fff;\">SUBMIT A FILE (ART. 20)</button>\n<input type=\"file\" accept=\".json,application/json\" sc-camel-on-change=\"{{ submitFile }}\" ref=\"{{ fileRef }}\" style=\"display:none;\">\n<button sc-camel-on-click=\"{{ cheat }}\" style=\"font-size:9px;padding:3px 7px;border:1px dotted #0b0b0c;background:#fff;cursor:pointer;opacity:.85;\" style-hover=\"opacity:1;background:#0b0b0c;color:#fff;\">{{ cheatLabel }}</button>\n<button sc-camel-on-click=\"{{ hardReset }}\" style=\"font-size:9px;padding:3px 7px;border:1px dotted #0b0b0c;background:#fff;cursor:pointer;opacity:.85;\" style-hover=\"opacity:1;background:#0b0b0c;color:#fff;\">{{ resetLabel }}</button>\n</div>\n</div>\n\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;devMode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;section&quot;:&quot;Developer&quot;,&quot;tsType&quot;:&quot;boolean&quot;},&quot;simSpeed&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.25,&quot;max&quot;:8,&quot;step&quot;:0.25,&quot;unit&quot;:&quot;×&quot;,&quot;section&quot;:&quot;Simulation&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;glitchCeiling&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0,&quot;max&quot;:1.5,&quot;step&quot;:0.05,&quot;section&quot;:&quot;Simulation&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;ambientGoo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;section&quot;:&quot;Simulation&quot;,&quot;tsType&quot;:&quot;boolean&quot;},&quot;marioName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;M.&quot;,&quot;section&quot;:&quot;Facilities&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  /* ============================================================================\n     DESIGN BIBLE — LOCKED DECISIONS (do not water down; full text in CLAUDE.md)\n     These are the patterns the author kept repeating; hardcoded here so they\n     survive context trimming and stay attached to the source.\n     ----------------------------------------------------------------------------\n     1  ENDLESS (important): never a real loss; always scale up; meaning recombined.\n     2  YOU ARE THE ALGORITHM: switch auto<->manual; never lose but FEEL like failing;\n        evade piling tasks by switching; you only care about keeping the DB alive.\n     3  M./CYBERMARIO (cherished, make it shine): black skateboarder swapping parts in\n        a machinery building; rectangular glasses, short hair, plump lips; very slow,\n        Baloo-like, smaller; works in BACKGROUND while networking is chaos; activity\n        tracker; Chrome-dino/SUPERHOT-simple, demoscene; DMT \"comes back thru out door\";\n        his mode is NEVER mandatory; tasks pile up while away; MAIN subplot not the game.\n     4  GLITCH (don't underdo it): white page baseline; flickering random pixel groups,\n        random color, lumps of gleaming multicolor 3D-ish goo; META layer for saturation;\n        delayed onset ~5min, not at start.\n     5  SATURATION: at 98% a competitor buys the factory, resets ~back to normal.\n     6  NUMBERS MAKE MUSIC: counters at different speeds trace sines; tone tracks\n        consumption; audio purchasable early, tied to cybermario.\n     7  BUREAUCRATIC ABSURDISM / cold euphemism (hellish): notifications pile up -> auto\n        -reply agents -> crash logs pile on top; recursion IS the feature; flat cold copy.\n     8  COSMIC/ASCII HORROR: stalled end = buy all GAFAM, sell only to self (closed loop);\n        DMT loops turn farms/parts into little characters (Mario-Wonder but stronger).\n     9  INPUT UNPREDICTABILITY: non-mouse input misbehaves; regularity-seekers get regularity\n        then it's revoked; buy it back in a HIDDEN DEBT MENU.\n     10 NO STANLEY PARABLE: never constantly address player; fourth wall stays procedural\n        (glitch, drifting UI, fake consent/cookie banners as mechanics).\n     11 PACING: ~4h playable, emergent per run; absurd within 10min then calm plateaux that\n        rot as you scale; failing triggers miracles (CEO day off -> sales climb).\n     12 STRUCTURE: prestige loops ARE the tutorial; endless+audits is core; networking main,\n        cybermario main subplot, DMT optional pandemonium; all connected.\n     ============================================================================ */\n  /* ============================================================================\n     CANON — DO NOT REGRESS\n     ----------------------------------------------------------------------------\n     Everything here has been requested more than once, some of it many times. It\n     is settled. A later pass that reintroduces any of it is a regression, not a\n     revision. If one of these must change, it changes because the player asked\n     for that specific thing, in words, and the request is recorded beside it.\n\n     C-1  ONE AUDIO CONTEXT. ac() owns it. Never `new AudioContext` anywhere\n          else, never reassign this.actx. Four constructors is how the build\n          shipped \"cannot connect to an AudioNode belonging to a different audio\n          context\" to a player. (2026-08-05)\n     C-2  NEVER WIRE A HANDLER THAT DOES NOT EXIST. cloneAuto/dismissAuto sat in\n          renderVals as live onClicks with no methods behind them, so two buttons\n          threw on every press. If the template names it, the class defines it.\n     C-3  NO AMBIENT CONFETTI. Sparks are for what he DOES — grinding, landing,\n          repairing under a held key. Nothing on the floor may emit on a timer or\n          on Math.random() per frame: not flagged units, not item glints, not a\n          motionless board. Reported as \"confetti for no reason\" in R-02 and\n          again on 2026-08-05. The screen is quiet unless he acts.\n     C-4  THE WORLD DOES NOT RESTYLE ITSELF UNDER YOU, AND CORRIDORS NEVER\n          RESTYLE IT AT ALL. In NEURO you walk normally — one plain style,\n          STYLE_PLAIN — until you MEET a mind. Meetings are the only thing that\n          moves the look: nothing for the first A_ESC_AFTER of them, then one\n          step along A_ESCALATE per new mind, tame to wild, ending at the\n          oscilloscope. N overrides by hand. Deriving style from the corridor\n          number read as skipping and jumping around and was asked to stop twice\n          (2026-08-05). styleFlash fires only when the skin actually changed.\n          ONE STEP PER CORRIDOR — a corridor spawns eight minds, so counting each\n          one ran the ladder out in a single stage and parked on the oscilloscope.\n     C-9  NOTHING MOVES HIM THAT HE DID NOT ASK FOR. A portal cell announces\n          itself and waits for ENTER; it does not transport on contact. Reported\n          as \"moving me randomly, no agency\" (2026-08-05). The same rule killed\n          stationaryFix on the floor.\n     C-5  MODE KEYS ARE A CONTRACT: 1 desk · 2 floor · 3 neuro · 4 phone ·\n          0 wu-wei · 5 developer access · SHIFT+D the dose · N corridor style ·\n          ENTER takes a portal. If a key is documented in a comment, it has a\n          handler — 5 was documented as the cheat control for a whole version with\n          nothing behind it. And a global shortcut NEVER takes a bare WASD letter:\n          the dose on plain `d` killed move-right on the floor, turn-right in\n          NEURO and the eye test's right answer, all three at once (2026-08-05).\n     C-6  \"VAULT\" MEANS THE ARCHIVE — the page holding his full texts, and\n          nothing else. The squeeze quest is q_squeeze; the miracle.nu database\n          panel's flag is q_dbSeen. Renaming either back collides with the\n          archive work in save data and in every conversation about it.\n     C-7  PROVENANCE TRAVELS WITH THE TEXT. Every fragment keeps .w, its source\n          work. Do not strip it when minifying. No fragment of the 2010-11\n          private email archive is a source for anything, in any pool, ever.\n     C-8  READABILITY IS NOT DECORATION. The Zhuangzi lines on the trip are\n          large, half-transparent, soft-edged and hold long enough to read while\n          surfing. They were 13-22px behind a plate and went past unread. Do not\n          shrink them back to a caption.\n     ============================================================================ */\n  get TUNE(){ return (window.DFS && window.DFS.tuning) || {}; }\n  get ART(){ return (window.DFS && window.DFS.art) || {}; }\n  /* The other half of the transfer: a build finds states left for it by LATER builds. This is what\n     makes \"revert to the in medias res\" real rather than a caption — the offer only appears if a\n     newer build actually wrote one for this id. */\n  legacyInbox() {\n    try {\n      const k = 'dfs.legacy.' + this.BUILD_ID, raw = localStorage.getItem(k);\n      if (!raw) return null;\n      const st = JSON.parse(raw);\n      return { key: k, from: st.legacyFrom || '?', at: st.legacyAt || 0, phase: st.phase || 0, acq: st.acq || 0 };\n    } catch(_) { return null; }\n  }\n  loadLegacy = () => {\n    const inb = this.legacyInbox(); if (!inb) return;\n    this.click('sign');\n    try {\n      const st = JSON.parse(localStorage.getItem(inb.key));\n      delete st.legacyFrom; delete st.legacyAt;\n      st.buildId = this.BUILD_ID;\n      /* ONLY WHAT THIS BUILD ALREADY KNEW. Copying a newer state wholesale would carry fields this\n         version has no code for — they would sit in the save, be written back on every tick, and\n         corrupt it quietly. So the adoption is an INTERSECTION with the keys already present, and\n         the count of what was dropped is reported. The farm comes back with pieces missing. That is\n         the honest behaviour and it is also the better joke. */\n      let kept = 0, dropped = 0;\n      for (const k in st) { if (Object.prototype.hasOwnProperty.call(this.g, k)) { this.g[k] = st[k]; kept++; } else dropped++; }\n      this._legacyDrop = dropped;\n      localStorage.removeItem(inb.key);\n      this.say('A state from ' + inb.from + ' has been adopted. ' + (this._legacyDrop||0) + ' field(s) were not recognised and have been discarded. They are not listed.', 'note');\n      this.save(); this.setState({});\n    } catch(_) {}\n  };\n  _checkModules(final) {\n    // addendum §2: a standalone download has no game/ folder to fetch, and its modules are\n    // inlined at build time. If they are genuinely populated there is nothing wrong — and a\n    // banner that fires when nothing is wrong stops being read within a day, which is exactly\n    // how the original orphaned-module bug survived. Only a module that was EXPECTED and\n    // FAILED gets the red band.\n    const miss = ['tuning','art','narrative','versions','zhuangzi'].filter(k => !window.DFS || !window.DFS[k]);\n    if (!window.MarioCorpus) miss.push('mario_corpus.js');\n    if (!window.DFS_MARIO_PACK) miss.push('mario_corpus_pack.js');\n    if (!this.corpus && window.MarioCorpus && window.DFS_MARIO_PACK && this.g) { try { this.corpus = new window.MarioCorpus(window.DFS_MARIO_PACK, this.g.seed||1); } catch(e) {} }\n    /* ORPHANED SECTIONS. The module can load while a SECTION the engine reads is absent — which\n       is what happened to `tuning.friction`: three readers, seven keys, nothing behind any of\n       them, so the vumeter could not be tuned at F2 or by editing the file, and no warning ever\n       fired. The module-level check could not see it. This asserts the sections themselves. */\n    const T = (window.DFS && window.DFS.tuning) || null;\n    if (T && final) {\n      const need = ['floor','alley','squeeze','neuro','decay','economy','trip','office','ui',\n                    'friction','processing','bundles','harvestScale','wuwei','cascade',\n                    'supply','layouts','vertical','paper','sky','outside','grow','instruments',\n                    'encounter','critters'];\n      const gone = need.filter(k => !T[k] || typeof T[k] !== 'object');\n      if (gone.length) { miss.push('tuning.' + gone.join(', tuning.')); console.error('[DFS] ORPHANED TUNING SECTIONS:', gone.join(', '), '— the engine reads them; nothing supplies them.'); }\n    }\n    this._inline = !!window.DFS_INLINE;\n    const had = !!this._orphaned; this._orphaned = miss.length ? miss : null;\n    if (miss.length && final) {\n      if (this._inline) console.warn('[DFS] standalone build, modules not inlined:', miss.join(', '), '— running on inline defaults, which is expected here.');\n      else console.error('[DFS] ORPHANED MODULES:', miss.join(', '), '— expected from game/ and not loaded.');\n    }\n    if (had !== !!this._orphane ); }\n    /* THE RETURN, applied. A docile herd yields more per head and recruits fewer — so optimising the\n       loop tightens it: the better your customers work the herd, the less of a herd there is to\n       come. That is the shape Cheikh asked to be made visible, and it has to be felt, not labelled. */\n    { const _d = this.docility(); this.g._docPrev = _d;\n      g.dataPerUser = (g.dataPerUser||1);\n      this._yieldMul = 1 + _d*0.9;\n      g.virality = Math.max(0, (g.virality||0) * (1 - _d*0.0009)); }\n    // saturation\n    /* THE PHASE TERM IS LOGARITHMIC. It was linear (phase*0.0012), so every phase mechanically\n       shortened the next run: by PHASE VIII it alone outran the 0.006 drain and acquisition arrived\n       in a couple of minutes whatever you did. That contradicts §1 (you can always scale up) and\n       §11 (calm plateaux that go bad as you scale, not a fuse). Log-scaled it still rises for ever\n       — PHASE IV 0.0028, VIII 0.0038, XX 0.0055 — but it never becomes the whole story. Each\n       acquisition also buys a little tolerance: the market has seen you do this before. */\n    const _phT = Math.log10(1 + (g.phase||0))*0.0042;\n    const _acqEase = 1 / (1 + (g.acq||0)*0.12);\n    let satUp = (0.004*(g.extraction-1) + this.totalAgents()*0.0004 + (g.piles.length)*0.0015 + _phT + g.heat*0.0008) * _acqEase;\n    g.sat = Math.max(0, Math.min(100, g.sat + (satUp - 0.006) * dt * 10));\n    // the banner is a SYMPTOM of saturation, not a greeting at the door. It opens once, when the\n    // number first crosses the threshold, and never on launch — the game opens in medias res.\n    /* THE CASCADE (CLAUDE.md §10, fake consent banners as mechanics). When saturation first crosses\n       the threshold you do not get a banner to dismiss — you get a banner that opens a banner that\n       opens a banner, each one offset from the last, marching off the edge of the screen. Nothing\n       is clickable. It clears itself, and the farm never mentions           if (Math.random() < 0.34) {\n            // a poem offscreen is still three lines: it must carry the same provenance as one you\n            // watched, or the ledger silently credits watched work more than unwatched work.\n            const recs = [this.corpSourced('notebook'), this.corpSourced('break_line'), this.corpSourced('notebook')].filter(Boolean);\n            m.guilt = Math.max(0, (m.guilt||0) - 6);\n            m.task = 'writing something down. slowly.';\n            this.mlog(recs.length ? recs[0].text : 'wrote something down. unbilled.');\n            this.addPoem(recs.map(r => r.work), true);\n          }\n        }\n      }\n      else { m.state = 'idle'; m.timer = 6 + Math.random()*10; m.task = this.rnd(IDLE); }\n    }\n  }\n  /* §5 THE LEDGER. Every poem that happens is recorded WITH the work it came from. Provenance was\n     always in the corpus (`lineWithSource` returns `work` and `lang`); it was simply never kept.\n     Printed once, at the end of a run, as a receipt — not a score. Capped, so a long run doesn't\n     grow the save without bound. */\n  /* ONE ENTRY PER POEM, carrying the distinct works that poem drew on. The first cut recorded one\n     entry per LINE on screen but one per POEM offscreen, so the table mixed two units: \"2 × — Work\n     C\" meant two lines of one poem while \"1 × — Work D\" meant one whole poem. On a sheet headed\n     NON-SYNTHETIC OUTPUT OF RECORD, a provenance miscount undermines the only thing the feature\n     exists to assert. It also under-credited his unwatched work threefold and made the cap evict\n     watched poems three times faster. Both routes now report in the same unit. */\n  /* ONE DOOR for the counter. Every route that produces a poem goes through here, so no path can\n     bump `g.poems` without recording where it came from. SCHEDULE M counts its header from\n     `g.poems` and its table from `g.ledger`; any increment that skips the ledger reopens exactly\n     the incoherence v0.97 c h.max(0, Math.min(7, Math.floor(i) || 0));\n    if (!isFinite(amount)) amount = 0;\n    while (g.piles.length <= i) { g.piles.push({count:0, agents:0}); if (g.piles.length > 1) this.say('A new pile exists: ' + this.pileName(g.piles.length-1) + '. It did not exist before.'); }\n    g.piles[i].count += amount;\n  }\n  totalAgents() { return this.g.piles.reduce((s,p) => s + p.agents, 0); }\n  /* FRICTION. The piles metastasised beautifully and cost NOTHING — §7's recursion was scenery you\n     could ignore for ever. Unprocessed administration now drags on everything: log-scaled so the\n     first hundred items hurt and the ten-thousandth barely adds, capped so it can never fully stop\n     the farm (CLAUDE.md §1: never a real loss). BRAND EQUITY absorbs part of it — which is the\n     actual joke: the remedy for an admin backlog is publishing, and publishing makes more admin. */\n  /* ---------- PROCESSING (R-47..R-50) --------------------------------------------\n     Raw collection is not a product. `g.proc` is the share of the silo that has been refined,\n     and it is asymptotic by construction: the gain is multiplied by (1 − p/100)^resist, so the\n     first digits scream past, 50% is slow, 75% is minutes and 99.9999 is a wall the last digit\n     never crosses. Whatever you fail to refine becomes GHOST DATA on sale — which is not a\n     scold counter: it feeds the friction meter, so a badly-run silo slows the whole farm.\n     Finish-your-plate syndrome, expressed as a curve that resists your thumb.               */\n  PROC() { return (this.TUNE.processing) || {}; }\n  procCeil() { const P = this.PROC(); return P.ceiling == null ? 99.9999 : P.ceiling; }\n  procGain() {\n    const P = this.PROC(), g = this.g;\n    const head = Math.max(0, 1 - (g.proc||0)/100);\n    return (P.gain == null ? 43 : P.gain) * Math.pow(head, P.resist == null ? 4.2 : P.resist);\n  }\n  /* The reading. Above the ceiling the last digit reverts to 8 for ever — the number is not\n     stuck at a value, it is stuck in an act of revision. */\n  procFmt() {\n    const g = this.g, c = this.procCeil();\n    let p = Math.min(c, g.proc||0);\n    if (p >= c - 0.00005) {\n      const flick = Math.floor((g.t||0)*3) % 2;\n      return flick ? '99.9998' : '99.9999';\n    }\n    return p.toFixed(4);\n  }\n  procBand() {\n    const B = (this.NAR().procBands) || [], p = this.g.proc||0;\n    let out = B.length ? B[0].say : '';\n    for (const b of B) if (p >= b.at) out = b.say;\n    return out;\n  }\n  procAutoRate() {\n    const P = this.PROC(), lv = this.g.procAuto||0;\n    return lv * (P.autoRate == null ? 0.42 : P.autoRate);\n  }\n  procAutoCost() {\n    const P = this.PROC(), lv = this.g.procAuto||0;\n    return Math.round((P.autoCost == null ? 240 : P.autoCost) * Math.pow(P.autoStep == null ? 5.5 : P.autoStep, lv));\n  }\n  buyProcAuto = () => {\n    const g = this.g, P = this.PROC(), c = this.procAutoCost();\n    if (g.money < c || (g.procAuto||0) >= (P.autoLevels == null ? 8 : P.autoLevels)) return;\n    this.click('auto'); g.money -= c; g.procAuto = (g.procAuto||0) + 1;\n    const nm = ((this.NAR().procAutoNames) || [])[g.procAuto - 1] || 'REFINEMENT';\n    this.say(nm + ' engaged. The plate is being cleared without you.', 'good');\n    this.setState({});\n  };\n  procHold = () => { this.g.procHold = true; this.click('project'); };\n  procRelease = () => { this.g.procHold = false; };\n  tickProc(dt) {\n    const g = this.g, P = this.PROC(), c = this.procCeil();\n    if (g.proc == null) g.proc = 0;\n    // raw inflow DILUTES: walking away un-processes you, because the silo keeps filling.\n    const inflow = this.dataRate() * dt;\n    if (inflow > 0 && g.data > 0) {\n      const share = inflow / Math.max(inflow, g.data);\n      g.proc = Math.max(0, g.proc * (1 - share * (P.dilute == null ? 0.55 : P.dilute)));\n    }\n    // the thumb, and the machines\n    let gain = 0;\n    if (g.procHold) gain += this.procGain();\n    if ((g.procAuto||0) > 0) {\n      const head = Math.max(0, 1 - g.proc/100);\n      gain += this.procAutoRate() * Math.pow(head, (P.resist == null ? 4.2 : P.resist) * 0.62);\n    }\n    if (gain > 0) g.proc = Math.min(c, g.proc + gain*dt);\n    g.procFlash = Math.max(0, (g.procFlash||0) - dt);\n    if (g.procHold) g.procUse = (g.procUse||0) + dt;\n  }\n  /* Every sale routes here: the premium for what was refined, the residue for what was not.\n     ONE door, so the manual and automatic paths can never disagree about what a sale costs. */\n  procSale(units) {\n    const g = this.g, P = this.PROC();\n    const p = Math.min(this.procCeil(), g.proc||0)/100;\n    const mult = 1 + p * (P.premium == null ? 1.8 : P.premium);\n    g.handled = (g.handled||0) + units;\n    const ghost = units * (1 - p) * (P.ghostRate == null ? 0.42 : P.ghostRate)\n      * ((g.procUse||0) < 60 && (g.procUse||0) > 0 ? (P.firstRunBonus == null ? 3.5 : P.firstRunBonus) : 1);\n    if (ghost > 0) {\n      const was = g.ghost||0;\n      g.ghost = was + ghost;\n      // the light only flashes when the ledger crosses a decade — otherwise it is always on\n      if (was <= 0 || Math.floor(Math.log10(1+g.ghost)) > Math.floor(Math.log10(1+was))) {\n        g.procFlash = P.ghostFlash == null ? 2 : P.ghostFlash;\n        if (!g.done.ghostIntro) {\n          g.done.ghostIntro = true;\n          this.say((this.NAR().procGhostFirst) || 'the tool produces residue while it learns your hand.');\n        } else this.say(this.rnd((this.NAR().procGhost) || ['residue logged.']));\n      }\n    }\n    return mult;\n  }\n  /* ---------- BUNDLES & ANALYSTS (R-48, R-51) -------------------------------------\n     You do not sell \"data\". You sell a named product, about a named cohort, licensing a named\n     act — and the three names are always euphemisms for the same thing. A bundle consumes\n     refined material and pays a multiple of the raw silo, which is what makes R-47 worth doing\n     rather than a decorative percentage. Analysts are hired, never released, and each one\n     narrows what the farm is able to see.                                                    */\n  BUN() { return (this.TUNE.bundles) || {}; }\n  bundleSlots() { return ['who', 'what', 'do']; }\n  bundlePool(slot) {\n    const N = this.NAR(), g = this.g;\n    const base = slot === 'who' ? (N.bundleWho||[]) : slot === 'what' ? (N.bundleWhat||[]) : (N.bundleDo||[]);\n    // an analyst on this slot opens the back half of its pool\n    const hired = (g.analysts||[]).length;\n    const open = Math.max(4, Math.ceil(base.length * (0.45 + hired*0.12)));\n    return base.slice(0, Math.min(base.length, open));\n  }\n  analystMult() {\n    const A = (this.NAR().analysts) || [], hired = this.g.analysts || [];\n    // additive, not multiplicative: compounding six of them reached ×21.4 and made every other\n    // decision in the game irrelevant. Summed, the full bench is ×5.1 — still the biggest lever\n    // in the farm, and still worth the eleven million it costs.\n    return A.reduce((m, a) => hired.indexOf(a.k) >= 0 ? m + (a.mult - 1) : m, 1);\n  }\n  // the phase scale is shared by cost and pay: a bundle is always worth ~15-120× the material\n  // it consumes, never more because the farm got bigger.\n  bunScale() { const B = this.BUN(); return Math.pow(B.payPerPhase == null ? 6.5 : B.payPerPhase, this.g.phase||0); }\n  bundleCost() {\n    const B = this.BUN();\n    return (B.costPerSlot == null ? 1.6 : B.costPerSlot) * 3 * this.bunScale();\n  }\n  bundlePay() {\n    const B = this.BUN(), g = this.g;\n    const p = Math.min(this.procCeil(), g.proc||0)/100;\n    return (B.basePay == null ? 34 : B.basePay) * this.bunScale()\n      * (1 + p * (B.procWeight == null ? 2.4 : B.procWeight))\n      * this.analystMult() * g.quality * (1 - this.friction()*0.7);\n  }\n  bundleReady() { const b = this.g.bun || {}; return this.bundleSlots().every(k => b[k]); }\n  bundleRoll = (slot) => {\n    const g = this.g, B = this.BUN();\n    if ((g.proc||0) < (B.minProc == null ? 12 : B.minProc)) { this.say((this.NAR().bundleThin) || 'too raw.'); return; }\n    g.bun = g.bun || {};\n    this.click('project');\n    const pool = this.bundlePool(slot);\n    g.bun[slot] = pool[Math.floor(Math.random()*pool.length)];\n    g.bun[slot + 'Spin'] = (this.g.t||0) + (B.slotSpin == null ? 0.55 : B.slotSpin);\n    this.setState({});\n  };\n  bundleShip = () => {\n    const g = this.g;\n    if (!this.bundleReady()) return;\n    const cost = this.bundleCost();\n    if (g.data < cost) { this.say('not enough material. harvest, then refine.'); return; }\n    this.click('sell');\n    const pay = this.bundlePay();\n    g.data -= cost; g.money += pay; g.lifetimeRev += pay;\n    g.bundles = (g.bundles||0) + 1;\n    // an assembled product still leaves residue for the unrefined share\n    this.procSale(cost);\n    const name = [g.bun.who, g.bun.what, g.bun.do].join(' / ');\n    this.say('BUNDLE ' + g.bundles + ': ' + name + ' — ' + this.fmtMoney(pay) + '. '\n      + this.rnd((this.NAR().bundleSold) || ['shipped.']), 'good');\n    g.bun = {};\n    this.blip(520); this.setState({});\n  };\n  hireAnalyst = (k) => {\n    const g = this.g, A = ((this.NAR().analysts) || []).find(x => x.k === k);\n    if (!A || (g.analysts||[]).indexOf(k) >= 0 || g.money < A.cost) return;\n    this.click('agent'); g.money -= A.cost;\n    g.analysts = (g.analysts||[]).concat([k]);\n    this.say(A.n + ' — ' + ((this.NAR().analystHired) || 'hired.') + ' ' + A.say, 'good');\n    this.setState({});\n  };\n  /* R-49, corrected. Residue drag must be SCALE-FREE. As an absolute count run through a bare\n     log10 it pinned the cap at 7,498 units — which a phase-3 farm banks in 4.5 seconds — so the\n     penalty was permanently maxed and refining changed nothing about it: the opposite of \"you have\n     to take care of that\". Data units grow exponentially with phase; the residue term did not\n     normalise. It is now the SHARE of lifetime throughput that turned to residue, which is exactly\n     the quantity the player controls with the refinement dial, is bounded 0..1 by construction at\n     any scale, and RECOVERS — refine well and the share falls as throughput grows, so the meter is\n     a thing to manage rather than a one-way ratchet. Same log-normalisation reasoning that fixed\n     the herd monitor in v0.77. */\n  ghostShare() {\n    const g = this.g, gh = g.ghost||0, hd = g.handled||0;\n    if (gh <= 0) return 0;\n    return gh / (gh + Math.max(1, hd));\n  }\n  /* ---------- INSTRUMENTS (R-52) ---------------------------------------------------\n     Five readings of the live analyser, each in its own coordinate system. They are drawn by ONE\n     routine so that NEURO can mount the same code as corridor modes (R-53) without a second\n     implementation drifting away from this one.                                              */\n  INST() { return (this.TUNE.instruments) || {}; }\n  INST_KINDS = ['scope', 'spectrum', 'lograin', 'fib', 'phase'];\n  INST_NAMES = { scope:'OSCILLOSCOPE', spectrum:'SPECTRUM', lograin:'LOGARITHMIC RAIN', fib:'FIBONACCI DRIFT', phase:'PHASE PLOT' };\n  INST_SAYS = {\n    scope: 'the signal, unprojected. the farm is audible and this is its edge.',\n    spectrum: 'energy by band, spaced logarithmically. the low end is the harvest.',\n    lograin: 'each band falls through nine decades of its own scale. nothing lands.',\n    fib: 'a golden-angle field, displaced by brownian noise until the order is only implied.',\n    phase: 'two rates plotted against each other. the farm draws its own portrait and does not recognise it.',\n  };\n  scopeData() {\n    const S = this.scope;\n    if (S && this.g.audioOn) { try { S.getByteTimeDomainData(this.scopeWave); S.getByteFrequencyData(this.scopeFreq); return true; } catch(_) {} }\n    return false;\n  }\n  /* When there is no audio the instruments must still move, or a muted player sees five dead\n     boxes and concludes they are broken. They fall back to the farm's own numbers F.length:64)/N));\n        const speed = 0.25 + (b%7)*0.11;\n        const u = ((t*speed + b*0.37) % 1);\n        const y = (Math.log10(1 + u*(Math.pow(10, dec) - 1))/dec) * h;\n        const x = (b + 0.5)/N * w;\n        const r = 0.7 + v*2.6;\n        ctx.globalAlpha = 0.25 + 0.75*v;\n        ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();\n      }\n      ctx.globalAlpha = 1;\n    } else if (kind === 'fib') {\n      // golden-angle field, displaced by brownian noise until the order is only implied\n      const N = Math.min(I.dots == null ? 320 : I.dots, 420), GA = 2.39996323;\n      const br = I.brown == null ? 0.34 : I.brown;\n      if (!this._fibN || this._fibN.length !== N) { this._fibN = new Float32Array(N*2); for (let i=0;i<N*2;i++) this._fibN[i] = 0; }\n      const cx = w/2, cy = h/2, R = Math.min(w, h)*0.46;\n      for (let i = 0; i < N; i++) {\n        const v = bin(Math.floor(i*(live?F.length:64)/N));\n        this._fibN[i*2]   += (Math.random()-0.5)*br*(0.4+v*2);\n        this._fibN[i*2+1] += (Math.random()-0.5)*br*(0.4+v*2);\n        this._fibN[i*2]   *= 0.985; this._fibN[i*2+1] *= 0.985;\n        const rr = Math.sqrt(i/N)*R, a = i*GA + t*0.13;\n        const x = cx + Math.cos(a)*rr + this._fibN[i*2]*R*0.09;\n        const y = cy + Math.sin(a)*rr + this._fibN[i*2+1]*R*0.09;\n        ctx.globalAlpha = 0.18 + 0.8*v;\n        ctx.fillRect(x, y, 1.4, 1.4);\n      }\n      ctx.globalAlpha = 1;\n    } else {\n      // two of the farm's own rates against each other — it draws its own portrait\n      const a1 = 1 + Math.log10(1 + this.hsRate()) * 1.7;\n      const a2 = 1 + (g.proc||0)/100 * 2.6 + this.ghostShare()*3;\n      const N = 460, cx = w/2, cy = h/2, R = Math.min(w, h)*0.44;\n      ctx.beginPath();\n      for (let i = 0; i < N; i++) {\n        const u = (i/N)*6.283;\n        const v = amp(i) * 0.16;\n        const x = cx + Math.sin(u*a1 + t*0.4)*R*(1 + v);\n        const y = cy + Math.sin(u*a2 + t*0.27 + 1.1)*R*(1 + v);\n        if (!i) ctx.moveTo(x, y); else ctx.lineTo(x, y);\n      }\n      ctx.stroke();\n    }\n  }\n  instRef = React.createRef();\n  instPick = (k) => { this.instKind = k; this.click('project'); this.setState({}); };\n  drawInstrument() {\n    const cv = this.instRef.current; if (!cv) return;\n    const w = cv.clientWidth, h = cv.clientHeight; if (!w || !h) return;\n    const dpr = Math.min(2, window.devicePixelRatio || 1);\n    if (cv.width !== Math.round(w*dpr)) { cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); this._instFresh = true; }\n    const ctx = cv.getContext('2d');\n    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    if (this._instFresh) { ctx.fillStyle = '#0b0b0c'; ctx.fillRect(0,0,w,h); this._instFresh = false; }\n    this.instDraw(this.instKind || 'scope', ctx, w, h, '#3fd98f');\n  }\n  /* ---------- THE SUPPLY CHAIN ----------------------------------------------------\n     The one system that makes the desk DEPEND on M. rather than mention him. You order parts; they\n     arrive after a lead time nobody will expedite; they sit in the bay until somebody installs\n     them; and the only somebody is him. A desk repair costs money AND a part. Run the bay dry and\n     the desk cannot repair anything at all — the bottleneck is a person, which is the invariant\n     CLAUDE.md §3 and §12 keep asserting and the economy never modelled.                       */\n  SUP() { return (this.TUNE.supply) || {}; }\n  partCost() {\n    const S = this.SUP(), g = this.g;\n    return Math.round((S.partCost == null ? 34 : S.partCost) * Math.pow(S.partPerPhase == null ? 2.1 : S.partPerPhase, g.phase||0));\n  }\n  orderBatch() { const S = this.SUP(); return (S.batchMin == null ? 4 : S.batchMin) * (1 + (this.g.phase||0)); }\n  orderCost() { return this.partCost() * this.orderBatch(); }\n  orderParts = () => {\n    const g = this.g, S = this.SUP(), c = this.orderCost();\n    if (g.money < c) return;\n    this.click('rack'); g.money -= c;\n    const lead = (S.leadSeconds == null ? 46 : S.leadSeconds) * (1 + (Math.random()*2 - 1)*(S.leadVary == null ? 0.35 : S.leadVary));\n    g.orders = (g.orders || []).concat([{ n: this.orderBatch(), due: (g.t||0) + lead, placed: this.clock() }]);\n    this.say(this.rnd((this.NAR().orderPlaced) || ['ordered.']));\n    this.setState({});\n  };\n  /* Thirst. The draw already exhausted a source; now exceeding it also STARVES the farm, so water\n     is a live constraint rather than a counter that eventually pops a purchase. */\n  thirst() {\n    const g = this.g, S = this.SUP();\n    const cap = 40 * Math.pow(3, g.waterSrc||0);\n    const u = (g.water||0) / Math.max(1, cap);\n    const at = S.thirstAt == null ? 0.82 : S.thirstAt;\n    if (u <= at) return 0;\n    return Math.min(S.thirstMax == null ? 0.55 : S.thirstMax, ((u - at)/(1 - at)) * (S.thirstMax == null ? 0.55 : S.thirstMax));\n  }\n  tickSupply(dt) {\n    const g = this.g, S = this.SUP();\n    if (!g.orders || !g.orders.length) return;\n    const cap = S.bayCap == null ? 240 : S.bayCap;\n    const arrived = g.orders.filter(o => (g.t||0) >= o.due);\n    if (!arrived.length) return;\n    g.orders = g.orders.filter(o => (g.t||0) < o.due);\n    let got = 0; arrived.forEach(o => got += o.n);\n    g.parts = Math.min(cap, (g.parts||0) + got);\n    this.say((this.NAR().orderIn) || 'the consignment is in the bay.');\n  }\n  /* ---------- §8 ASCII HORROR: the critters ---------------------------------------\n     The props he works on all day acquire faces during the trip. Not friendly, not hostile:\n     ADMINISTERED — they talk about themselves the way the facility talks about him, and the horror\n     is that they are more clearly people than the users are. They drift, they approach a little\n     because they are curious, and one of them says something every few seconds. */\n  CRIT() { return (this.TUNE.critters) || {}; }\n  critterSpawn(T, vw, vh) {\n    const C = this.CRIT(), pool = (this.NAR().critters) || [];\n    if (!pool.length) return;\n    T.crit = [];\n    const n = C.count == null ? 9 : C.count;\n    for (let i = 0; i < n; i++) {\n      const k = pool[Math.floor(Math.random()*pool.length)];\n      T.crit.push({ kind: k, x: T.x + (Math.random()*2-1)*180, y: T.y - 60 + (Math.random()*2-1)*90,\n        vx: (Math.random()*2-1)*(C.speed == null ? 11 : C.speed), vy: (Math.random()*2-1)*(C.speed == null ? 11 : C.speed)*0.6,\n        ph: Math.random()*7, said: '', saidT: 0, hue: Math.random()*360 });\n    }\n    T.critT = 1.2;\n    this.fmsg((this.NAR().critterEnter) || 'the parts have faces in here.', 4);\n  }\n  critterTick(T, dt) {\n    const C = this.CRIT();\n    if (!T.crit) return;\n    T.critT = (T.critT||0) - dt;\n    if (T.critT <= 0) {\n      T.critT = C.sayEvery == null ? 6.5 : C.sayEvery;\n      const pick = T.crit[Math.floor(Math.random()*T.crit.length)];\n      if (pick) { pick.said = this.rnd(pick.kind.say || ['—']); pick.saidT = C.sayHold == null ? 5.2 : C.sayHold; }\n    }\n    const app = C.approach == null ? 0.35 : C.approach;\n    for (const c of T.crit) {\n      const dx = T.x - c.x, dy = T.y - c.y, d = Math.hypot(dx, dy) || 1;\n      // curious, not hostile: they close to a polite distance and then hold it\n      const pull = d > 70 ? app : -app*0.6;\n      c.x += (c.vx + dx/d*pull*30 + Math.cos(c.ph + T.t*0.5)*8)*dt;\n      c.y += (c.vy + dy/d*pull*30 + Math.sin(c.ph*1.4 + T.t*0.4)*8)*dt;\n      c.saidT = Math.max(0, c.saidT - dt);\n    }\n  }\n  critterDraw(ctx, T, camX, camY, vw, vh) {\n    const C = this.CRIT();\n    if (!T.crit) return;\n    const sc = C.scale == null ? 2.4 : C.scale;\n    for (const c of T.crit) {\n      const sx = c.x - camX, sy = c.y - camY;\n      if (sx < -80 || sx > vw + 80 || sy < -80 || sy > vh + 80) continue;\n      const fr = c.kind.face[Math.floor((T.t*4 + c.ph) % c.kind.face.length)];\n      ctx.textAlign = 'center';\n      // the body, in its own colour, jittering by a pixel so it never sits still\n      ctx.font = '700 ' + Math.round(11*sc) + 'px monospace';\n      ctx.fillStyle = 'hsl(' + Math.round(c.hue + T.t*8) + ',85%,66%)';\n      ctx.fillText(fr, sx + (Math.random()<0.3?1:0), sy);\n      // the eyes, always the same, always looking at him\n      ctx.font = Math.round(6*sc) + 'px monospace';\n      ctx.fillStyle = 'rgba(10,8,12,.9)';\n      ctx.fillText(c.kind.eyes, sx, sy - 3*sc);\n      if (c.saidT > 0) {\n        const a2 = Math.min(1, c.saidT/1.4);\n        ctx.font = Math.max(10, Math.round(5.5*sc)) + 'px monospace';\n        const w2 = ctx.measureText(c.said).width;\n        ctx.fillStyle = 'rgba(6,4,8,' + (0.66*a2).toFixed(2) + ')';\n        ctx.fillRect(sx - w2/2 - 6, sy + 6*sc, w2 + 12, 16*sc*0.9);\n        ctx.fillStyle = 'rgba(240,236,246,' + (0.95*a2).toFixed(2) + ')';\n        ctx.fillText(c.said, sx, sy + 15*sc*0.9);\n      }\n      ctx.textAlign = 'left';\n    }\n  }\n  frictionRaw() {\n    const g = this.g;\n    const items = (g.piles||[]).reduce((s,p) => s + (p.count||0), 0);\n    const F = (this.TUNE.friction) || {};\n    const gh = this.ghostShare() * (F.ghostMax == null ? 0.42 : F.ghostMax);\n    if (items <= 0 && gh <= 0) return 0;\n    return Math.min(F.cap == null ? 0.62 : F.cap,\n      Math.log10(1 + items) / (F.decades == null ? 5.2 : F.decades) + gh);\n  }\n  friction() {\n    const g = this.g, F = (this.TUNE.friction) || {};\n    return this.frictionRaw() * (1 - (g.brand||0) * (F.brandAbsorb == null ? 0.55 : F.brandAbsorb));\n  }\n  tickPiles(dt) {\n    const g = this.g;\n    if (g.piles.length === 0 && g.users >= 40) { this.spawnPile(0, 3); this.say('You have users now. Users generate notifications. Notifications require processing. This is the law.'); }\n    if (g.piles.length === 0) return;\n    // inflow to layer 0\n    g.piles[0].count += (0.03 + g.users*0.00001 + g.customers*0.015 + (g.phase||0)*0.06 + (g.audit?0.5:0)) * dt * 10;\n    // agents process, spawning next layer\n    for (let i = 0; i < g.piles.length; i++) {\n      const p = g.piles[i];\n      if (p.agents > 0) {\n        const done = Math.min(p.count, p.agents * 0.6 * dt * 10);\n        p.count -= done;\n        if (done > 0) this.spawnPile(Math.min(i+1, 7), done * (0.28 + (g.phase||0)*0.035));\n      }\n      // the bureaucracy metastasizes on its own: a large pile generates the pile ABOUT the pile\n      if (p.count > 250 && i < 7 && (g.phase||0) >= 1) this.spawnPile(i+1, p.count * 0.0016 * dt * 10);\n      p.count = Math.max(0, p.count);\n    }\n    // deepest layer with no agents slowly composts into saturation\n    const last = g.piles[g.piles.length-1];\n    if (last.count > 400) g.sat = Math.min(100, g.sat + 0.01*dt*10);\n  }\n  agentCost(i) { const p = this.g.piles[i]; return 25 * Math.pow(4, i) * Math.pow(1.35, p ? p.agents : 0); }\n\n  // ---------- audits ----------\n  tickAudit(dt) {\n    const g = this.g;\n    if (g.audit) {\n      g.audit.timer -= dt;\n      if (g.audit.timer <= 0) {\n        const fine = g.money * 0.15;\n        g.money -= fine; g.sat = Math.min(100, g.sat + 6);\n        this.say('AUDIT UNANSWERED. Fine assessed: ' + this.fmtMoney(fine) + '. The seal remains in your file forever.', 'bad');\n        g.audit = null; g.auditCd = 150 + Math.random()*150;\n      }\n      return;\n    }\n    if (g.phase < 1) return;\n    g.auditCd -= dt * (1 + g.heat*0.15);\n    if (g.auditCd <= 0) {\n      const sec = Math.floor(Math.random()*89+11) + '§' + Math.floor(Math.random()*9+1);\n      const forms = ['Form 27-B (Provenance of Feelings)','Schedule H (Undisclosed Inferences)','Exhibit K (Consent Chain of Custody)','Form 9 (Explain the Algorithm in One Sentence)','Annex Ω (List All Users Alphabetically by Dream)'];\n      const seals = ['harvest','campaign','sales'];\n      g.audit = { sec, form: this.rnd(forms), timer: 90, seal: this.rnd(seals), cost: Math.max(20, g.money*0.08) };\n      this.say('REGULATORY AUDIT (SECTION ' + sec + '). ' + g.audit.form + ' is demanded. One subsystem is SEALED pending review.', 'bad');\n      { const _au = this.corpLine('audit'); if (_au) { g.audit.voice = _au; this.say('\\u2014 ' + _au); } }\n      this.blip(180);\n    }\n  }\n\n  // ---------- acquisition (prestige) ----------\n  triggerAcq() {\n    const g = this.g;\n    const buyers = ['Verdant Metrics LLC','The Cloume Group','Sincere Data Amalgamated','Growth Object SA','A Larger Farm','Feldspath Metatransfer Holdings'];\n    const gain = Math.max(1, Math.floor(Math.pow(Math.log10(g.lifetimeRev+10), 2) * (1 + g.acq*0.5)));\n    g.acqGain = gain;\n    g.acqBody = 'Saturation has reached 98%.\\n\\nPursuant to the Standard Inevitability Clause, your farm has been acquired by ' + this.rnd(buyers) + ' for an amount that is confidential even to you.\\n\\nYou will retain: your liquidity (+' + gain + '), your technician, your file.\\nYou will lose: everything else.\\nWorkforce released: ' + this.fmt(this.firedCount()) + ' humans. They were not told your name.\\n\\nOnly your point of view survives the transfer. Some cosmetic drift may occur.\\n\\nThings will be relatively back to normal.';\n    /* §12 THE LOOP IS THE TUTORIAL. One finding per acquisition, in order, so the prestige loops\n       teach the game rather than merely reset it. Never addressed to the player (§10) — they are\n       findings about the asset, and the asset is you. Past the eleventh the findings become the\n       product, which is the last one and also the honest end of the list. */\n    const _L = (this.NAR().acqLessons) || [];\n    if (_L.length) {\n      const _li = Math.min(_L.length - 1, g.acq||0);\n      g.acqBody += '\\n\\n' + ((this.NAR().acqLessonHead) || 'OPERATIONAL REVIEW') + '\\n' + _L[_li];\n    }\n    // §5 the receipt. The acquisition sheet counts everything the farm produced; this is the one\n    // column it never had — what he wrote while it ran, and which of his books it came out of.\n    // §5 SCHEDULE M is WITHHELD from the sheet (Cheikh, 2026-07-29: \"too much — just the note of\n    // acquisition in medias res is already challenging enough\"). The ledg
